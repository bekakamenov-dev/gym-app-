<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Зал Бексултана</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Зал">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#1e2124">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>:root{padding:0;--gap:0px;--top:max(calc(env(safe-area-inset-top,0px) - 12px),0px);--bot:calc(env(safe-area-inset-bottom,0px)*.4)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sofia+Sans:wght@400;500;600;700;800&family=Sofia+Sans+Extra+Condensed:wght@700;800&display=swap">
<style>
/* «Гриф и мел» (v7). Графит, сталь и мел; цвета блинов A/B/C = красный 25, синий 20, жёлтый 15 кг.
   Одна смелая деталь: на главном экране гриф с блином следующей тренировки. Остальное спокойно.
   Шрифт один: Sofia Sans; узкая версия (Extra Condensed) для весов, таймера и заголовков, как табло в зале. */
:root{
  --bg:#e3e5e6; --surface:#f2f3f3; --surface-2:#d6d9db; --line:#c5c9cc;
  --fg:#1e2124; --muted:#565d64; --faint:#80878e;
  --steel-1:#9aa1a7; --steel-2:#c9cdd0; --steel-3:#6f767c;
  --plate-a:#cf3326; --plate-b:#2457c8; --plate-c:#c9940c; --plate-g:#2b8a4c;
  --on-plate:#ffffff; --ok:#2b8a4c; --warn:#c9940c;
  --shadow:none;
  --f-display:"Sofia Sans Extra Condensed","Sofia Sans",system-ui,sans-serif;
  --f-body:"Sofia Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"Sofia Sans Extra Condensed","Sofia Sans",system-ui,sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1e2124; --surface:#272b2f; --surface-2:#32373c; --line:#3a4046;
  --fg:#eceae4; --muted:#a3a7aa; --faint:#767c82;
  --steel-1:#5d646a; --steel-2:#8d949a; --steel-3:#454b50;
  --plate-a:#e8483a; --plate-b:#3f78ea; --plate-c:#e4b12a; --plate-g:#46b06a;
  --on-plate:#ffffff; --ok:#46b06a; --warn:#e4b12a;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#1e2124; --surface:#272b2f; --surface-2:#32373c; --line:#3a4046;
  --fg:#eceae4; --muted:#a3a7aa; --faint:#767c82;
  --steel-1:#5d646a; --steel-2:#8d949a; --steel-3:#454b50;
  --plate-a:#e8483a; --plate-b:#3f78ea; --plate-c:#e4b12a; --plate-g:#46b06a;
  --on-plate:#ffffff; --ok:#46b06a; --warn:#e4b12a;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:var(--top);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible,label:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
input,select{font:inherit;color:inherit}
.app{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(var(--top) + 4px) calc(92px + var(--bot))}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:700}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--f-display);font-weight:800;font-size:38px;line-height:.95;letter-spacing:0}
h2{font-family:var(--f-body);font-weight:700;font-size:17px}
.eyebrow{font-size:14px;font-weight:500;color:var(--muted)}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding-block:10px 8px}
.top > .muted, .top > .num{font-family:var(--f-num);font-weight:700;font-size:20px}
.card{background:var(--surface);border-radius:var(--r);padding:16px}
.section-title{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px}
.banner{font-size:14px;border-left:3px solid var(--plate-c);background:var(--surface);border-radius:4px;padding:10px 12px;color:var(--fg)}

/* блин: вид сверху, с ободом и втулкой */
.plate{--c:var(--plate-a);display:inline-grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--c);color:var(--on-plate);font-family:var(--f-display);font-weight:800;font-size:19px;line-height:1;flex:none;box-shadow:inset 0 0 0 3px color-mix(in srgb,#000 22%,var(--c)),inset 0 0 0 5px color-mix(in srgb,#fff 18%,var(--c))}
.plate.sm{width:28px;height:28px;font-size:15px;box-shadow:inset 0 0 0 2px color-mix(in srgb,#000 22%,var(--c))}
.plate.lg{width:56px;height:56px;font-size:28px}
.pA{--c:var(--plate-a)} .pB{--c:var(--plate-b)} .pC{--c:var(--plate-c)}

/* главная: гриф с блином следующей тренировки */
.next{--c:var(--fg);position:relative;overflow:hidden;padding:126px 18px 16px;border-radius:20px}
.next:has(.pA){--c:var(--plate-a)} .next:has(.pB){--c:var(--plate-b)} .next:has(.pC){--c:var(--plate-c)}
.next::before{content:"";position:absolute;left:-10px;right:0;top:62px;height:9px;border-radius:2px;
  background:repeating-linear-gradient(90deg,transparent 0 3px,rgba(0,0,0,.18) 3px 4px),linear-gradient(180deg,var(--steel-2),var(--steel-1) 55%,var(--steel-3))}
.next::after{content:"";position:absolute;right:-4px;top:56px;width:86px;height:21px;border-radius:3px;
  background:linear-gradient(180deg,var(--steel-2),var(--steel-1) 50%,var(--steel-3));box-shadow:-78px 0 0 -4px var(--steel-3)}
.next .plate.lg{position:absolute;right:86px;top:14px;width:40px;height:105px;border-radius:7px;font-size:26px;z-index:1;
  background:linear-gradient(90deg,color-mix(in srgb,#fff 14%,var(--c)),var(--c) 35%,color-mix(in srgb,#000 22%,var(--c)));
  box-shadow:-10px 0 0 -6px color-mix(in srgb,#000 30%,var(--c))}
.next h1{font-size:46px;margin-top:2px!important}
.next .meta{font-size:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 18px;border-radius:12px;font-weight:700;font-size:17px}
.btn.primary{background:var(--fg);color:var(--bg)}
.btn.plateA{background:var(--plate-a);color:var(--on-plate)}
.btn.plateB{background:var(--plate-b);color:var(--on-plate)}
.btn.plateC{background:var(--plate-c);color:var(--on-plate)}
.btn.ghost{background:var(--surface-2)}
.btn.danger{background:transparent;color:var(--plate-a);border:1.5px solid var(--plate-a)}
.btn.full{width:100%}
.btn.sm{min-height:38px;font-size:15px;padding:0 13px;border-radius:10px}
.next .btn{min-height:56px;font-size:19px}

/* выбор программы: три блина на полу */
.picker{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pick{background:transparent;border-radius:14px;padding:12px 10px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;min-width:0;border:1.5px solid var(--line)}
.pick .plate.sm{width:40px;height:40px;font-size:20px;box-shadow:inset 0 0 0 3px color-mix(in srgb,#000 22%,var(--c)),inset 0 0 0 5px color-mix(in srgb,#fff 18%,var(--c))}
.pick .t{font-weight:700;font-size:14px;line-height:1.2}
.pick .s{font-size:13px;color:var(--muted)}
.pick[aria-current="true"]{border-color:var(--fg);background:var(--surface)}

/* цифры: одна строка, как табло */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-block:1.5px solid var(--line);padding-block:10px}
.stat{padding:2px 12px;min-width:0;border-left:1.5px solid var(--line)}
.stat:first-child{border-left:0;padding-left:2px}
.stat b{display:block;font-family:var(--f-num);font-size:40px;line-height:1;font-weight:800}
.stat span{font-size:13px;color:var(--muted)}

.goal{display:flex;flex-direction:column;gap:8px}
.goal .row .num{font-size:26px}
/* прогресс к цели как гриф с насечкой */
.bar{height:12px;border-radius:3px;background:repeating-linear-gradient(90deg,transparent 0 3px,rgba(0,0,0,.12) 3px 4px),var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--plate-a);border-radius:3px}
.ticks{display:flex;justify-content:space-between;font-size:14px;color:var(--faint)}

/* нижняя панель */
.tabs{position:fixed;left:0;right:0;bottom:calc(0px - var(--gap));z-index:20;background:var(--bg);border-top:1.5px solid var(--line);padding-bottom:var(--bot);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs nav{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabs button{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 8px;font-size:12px;color:var(--faint);font-weight:600}
.tabs button[aria-current="page"]{color:var(--fg)}
.tabs button[aria-current="page"]::before{content:"";position:absolute;top:-1.5px;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--fg)}
.tabs svg{width:24px;height:24px}

/* списки */
.list{display:flex;flex-direction:column;background:var(--surface);border-radius:var(--r);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:13px 14px;border-top:1px solid var(--line);text-align:left;width:100%}
.item:first-child{border-top:0}
.item .grow{flex:1;min-width:0}
.item .t{font-weight:700}
.item .s{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item > .num{font-size:20px}
.chev{color:var(--faint);font-size:22px}

/* экран тренировки */
.layer{position:fixed;inset:0 0 calc(0px - var(--gap)) 0;z-index:40;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;padding-top:var(--top)}
.layer-in{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(140px + var(--bot))}
.whead{position:sticky;top:0;z-index:5;background:var(--bg);padding-block:12px 10px;display:flex;align-items:center;gap:12px;border-bottom:1.5px solid var(--line)}
.whead .grow{flex:1;min-width:0}
.whead .clock{font-family:var(--f-num);font-weight:700;font-size:17px;color:var(--muted);white-space:nowrap}
.whead .ttl{font-weight:800;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:42px;height:38px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;flex:none}
.iconbtn svg{width:20px;height:20px}
.ex{background:var(--surface);border-radius:var(--r);padding:16px 14px 12px;display:flex;flex-direction:column;gap:12px}
.ex.done{opacity:.6}
.ex-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ex-h .t{font-family:var(--f-display);font-weight:800;font-size:26px;line-height:1}
.ex-h .s{font-size:14px;color:var(--muted);margin-top:4px}
.hint{font-size:13px;font-weight:700;border-radius:8px;padding:4px 9px;background:var(--surface-2);white-space:nowrap}
.hint.up{background:var(--ok);color:#fff}
.sets{display:flex;flex-direction:column;gap:8px}
.set{display:grid;grid-template-columns:20px 1fr 1fr 54px;gap:8px;align-items:center}
.set .n{font-family:var(--f-num);font-weight:700;font-size:18px;color:var(--faint);text-align:center}
.step{display:grid;grid-template-columns:36px 1fr 36px;align-items:center;background:var(--surface-2);border-radius:10px;height:54px;min-width:0}
.step button{height:100%;font-size:22px;color:var(--muted)}
.step input{width:100%;min-width:0;height:30px;line-height:30px;border:0;background:transparent;text-align:center;font-family:var(--f-num);font-weight:800;font-size:30px;padding:0;-moz-appearance:textfield}
.step input::-webkit-outer-spin-button,.step input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.step small{display:block;text-align:center;font-size:11px;line-height:13px;color:var(--faint);pointer-events:none}
.unit{display:flex;flex-direction:column;justify-content:center;line-height:1.1}
.check{height:54px;border-radius:50%;width:54px;border:2px solid var(--line);display:grid;place-items:center;color:var(--faint)}
.check svg{width:24px;height:24px}
.set.is-done .check{background:var(--ok);border-color:var(--ok);color:#fff}
.set.is-done .step{background:color-mix(in srgb,var(--ok) 14%,var(--surface-2))}
.plates{font-size:14px;color:var(--muted)}
.ex-f{display:flex;gap:8px;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:8px}
.linkbtn{font-size:15px;font-weight:700;color:var(--fg);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:4px;padding:6px 0}
.ex-f .row{gap:16px}

/* таймер отдыха: табло */
.restbar{position:fixed;left:0;right:0;bottom:calc(0px - var(--gap));z-index:45;background:var(--fg);color:var(--bg);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(12px + var(--bot)) max(16px,env(safe-area-inset-left,0px))}
.restbar .in{max-width:520px;margin:0 auto;display:flex;align-items:center;gap:12px}
.restbar .time{font-family:var(--f-num);font-size:52px;line-height:1;font-weight:800;font-variant-numeric:tabular-nums;min-width:104px}
.restbar .grow{flex:1;min-width:0}
.restbar .lbl{font-size:14px;opacity:.8}
.restbar .prog{height:5px;background:color-mix(in srgb,var(--bg) 25%,transparent);border-radius:3px;margin-top:6px;overflow:hidden}
.restbar .prog i{display:block;height:100%;background:var(--bg)}
.restbar button{background:color-mix(in srgb,var(--bg) 16%,transparent);color:var(--bg);border-radius:10px;min-height:44px;padding:0 12px;font-weight:700;font-size:15px}
.restbar.over{background:var(--ok);color:#fff}
.restbar.over button{color:#fff}

/* нижние окна */
.scrim{position:fixed;inset:0 0 calc(0px - var(--gap)) 0;z-index:60;background:rgba(14,16,18,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));max-height:88vh;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.sheet h1{font-size:30px!important}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-block:1.5px solid var(--line);padding-block:10px}
.kv div{padding:0 12px;border-left:1.5px solid var(--line)}
.kv div:first-child{border-left:0;padding-left:2px}
.kv b{display:block;font-family:var(--f-num);font-size:30px;line-height:1.05;font-weight:800}
.kv span{font-size:13px;color:var(--muted)}
.exlog{display:flex;flex-direction:column;gap:6px}
.exlog .r{display:flex;justify-content:space-between;gap:12px;font-size:15px;border-top:1px solid var(--line);padding-top:7px}
.exlog .r:first-child{border-top:0}
.exlog .r span:last-child{font-family:var(--f-num);font-weight:700;font-size:17px;color:var(--muted);text-align:right}
.pr{color:var(--plate-a);font-weight:800}

/* формы */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;color:var(--muted);font-weight:600}
.inp{height:50px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);padding:0 14px;font-size:18px;width:100%;min-width:0}
.inp.num{font-size:20px}
.bwform{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end}
select.inp{appearance:none;font-weight:600;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 22px,calc(100% - 15px) 22px;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}

.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--f-num);font-weight:700;font-size:12px}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .goal{stroke:var(--plate-g);stroke-dasharray:4 4;stroke-width:1.5}
.chart .goalband{fill:var(--plate-g);opacity:.14}
.chart .goaltext{fill:var(--plate-g)}
.empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:15px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + var(--bot) - var(--gap));z-index:80;background:var(--fg);color:var(--bg);padding:11px 18px;border-radius:12px;font-size:15px;font-weight:700}
@media (max-width:380px){.picker .pick .s{display:none}.set{grid-template-columns:16px 1fr 1fr 48px;gap:6px}.step{grid-template-columns:28px 1fr 28px}.check{width:48px;height:48px}.step input{font-size:26px}.next h1{font-size:40px}}
@media (prefers-reduced-motion:no-preference){.ex,.pick,.btn,.check{transition:background-color .15s,opacity .15s,transform .1s}.btn:active,.check:active,.pick:active{transform:scale(.97)}}
/* v8: «Как делать», «Заменить», подсказки прогрессии, затемнение и «Погнали» */
.ex-a{display:flex;gap:8px;flex-wrap:wrap;margin-top:-2px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 13px;border-radius:10px;background:var(--surface-2);font-size:15px;font-weight:700;color:var(--fg);text-decoration:none}
.chip svg{width:15px;height:15px;flex:none}
.hint.down{background:var(--warn);color:#1e2124}
.vlink{display:inline-grid;place-items:center;width:26px;height:26px;margin-right:6px;border-radius:7px;background:var(--surface-2);color:var(--fg);vertical-align:-7px}
.vlink svg{width:12px;height:12px}
.dim{position:fixed;inset:0 0 calc(0px - var(--gap)) 0;z-index:70;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px;cursor:pointer}
.dim .big{font-family:var(--f-num);font-weight:800;font-size:132px;line-height:1;color:#43484d;font-variant-numeric:tabular-nums}
.dim .lbl{font-size:16px;color:#43484d;font-weight:600;max-width:320px}
.dim.go{background:var(--plate-g)}
.dim.go .big{font-family:var(--f-display);font-size:104px;color:#fff;text-transform:uppercase;letter-spacing:.01em}
.dim.go .lbl{color:#fff;opacity:.9}
@media (prefers-reduced-motion:no-preference){.dim.go .big{animation:go .5s ease-out}@keyframes go{from{transform:scale(.8);opacity:.3}to{transform:none;opacity:1}}}
</style>

</head>
<body>
<div class="app" id="app"></div>
<div class="tabs" id="tabs"><nav aria-label="Разделы">
  <button data-tab="today" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 10h2v4H3zM19 10h2v4h-2zM5 8h3v8H5zM16 8h3v8h-3zM8 12h8"/></svg>Тренировка</button>
  <button data-tab="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 9h16M9 3v4M15 3v4"/></svg>История</button>
  <button data-tab="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19h16M5 15l4-4 3 3 6-7"/></svg>Прогресс</button>

   bw свой вес + доп. отягощение, body только свой вес, other прочее), rest: отдых, сек,
   w0: вес для первого раза, yt: id видео «Как делать» на YouTube. */
const EXERCISES=JSON.parse(document.getElementById("exercise-db").textContent);
const GROUPS={legs:{n:"Ноги",big:true},glutes:{n:"Ягодицы",big:true},back:{n:"Спина",big:true},chest:{n:"Грудь",big:true},shoulders:{n:"Плечи",big:false},biceps:{n:"Бицепс",big:false},triceps:{n:"Трицепс",big:false},abs:{n:"Пресс",big:false}};

const STEP={bar:2.5,cable:2.5,machine:2.5,other:2.5,dumb:1,bw:2.5,body:0};
const EXMAP=Object.fromEntries(EXERCISES.map(e=>[e.id,{...e,step:e.step??STEP[e.eq]??2.5}]));

  "Жим гантелей сидя":"dumbbell_press_seated","Махи гантелями в стороны":"lateral_raise",
  "Подъём гантелей на наклонной скамье":"incline_curl","Разгибания с канатом на блоке":"rope_pushdown",
  "Пресс: подъём ног в висе":"hanging_leg_raise","Подтягивания":"pullup","Становая тяга":"deadlift",
  "Жим гантелей на наклонной (30°)":"incline_dumbbell_press","Тяга горизонтального блока к поясу":"seated_row",
  "Тяга каната к лицу (face pulls)":"face_pull","Молотки с гантелями":"hammer_curl","Французский жим сидя":"french_press_seated",
  "Пресс: скручивания на блоке":"cable_crunch","Жим ногами":"leg_press","Тяга штанги в наклоне":"barbell_row",
  "Жим штанги стоя":"overhead_press","Сгибания рук со штангой":"barbell_curl","Махи гантелями в наклоне":"rear_delt_raise",
};
// Шаг веса. Гантели в зале: до 10 кг через 1 кг, от 10 кг через 2 кг (10, 12, 14…).
const r2=v=>Math.round(v*100)/100;
function stepUp(eq,w,step){if(eq==="dumb")return w<10?Math.floor(w+1e-9)+1:Math.floor(w/2+1e-9)*2+2;return r2(w+(step||2.5))}
function stepDown(eq,w,step){if(eq==="dumb")return Math.max(0,w<=10?Math.ceil(w-1e-9)-1:Math.ceil(w/2-1e-9)*2-2);return Math.max(0,r2(w-(step||2.5)))}
function ceilGrid(eq,w,step){if(eq==="dumb")return w<=10?Math.ceil(w-1e-9):Math.ceil(w/2-1e-9)*2;return r2(Math.ceil(w/step-1e-9)*step)}
const BYNAME=Object.fromEntries(EXERCISES.map(e=>[e.n,e.id]));
const idFor=n=>LEGACY[n]||BYNAME[n]||("custom:"+n);
function exById(id){return EXMAP[id]||{id,n:String(id).replace(/^custom:/,""),g:null,eq:"other",step:2.5,rest:90,w0:0,yt:null}}

const ytSearch=e=>"https://www.youtube.com/results?search_query="+encodeURIComponent(e.n.replace(/^Пресс: /,"")+" техника");

function slotDef(slot){const ex=exById(slot.x);return {...ex,x:ex.id,s:slot.s,r:slot.r,rest:slot.rest??ex.rest,w0:slot.w0??ex.w0,note:slot.note||""}}

function migrate(){
  if(LS.get("zal_migrated",null))return;
  const ow=LS.get("gym.workouts",[]),ob=LS.get("gym.body",[]),oa=LS.get("gym.active",null),op=LS.get("gym.progEx",null);
  if(!LS.get("zal_workouts",null))LS.set("zal_workouts",ow.map(normWorkout));

  }
  if(op)LS.set("zal_progEx",idFor(op));
  LS.set("zal_migrated",{at:new Date().toISOString(),workouts:ow.length,body:ob.length});
}

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtKg=v=>{const n=Math.round(v*100)/100;return (Number.isInteger(n)?n:n.toFixed(n*10%1?2:1)).toString().replace(".",",")};
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const MON=["янв","фев","мар","апр","мая","июн","июл","авг","сен","окт","ноя","дек"];
const DOW=["вс","пн","вт","ср","чт","пт","сб"];
const fdate=iso=>{const d=new Date(iso);return d.getDate()+" "+MON[d.getMonth()]};
const fdateL=iso=>{const d=new Date(iso);return DOW[d.getDay()]+", "+d.getDate()+" "+MON[d.getMonth()]};
const fdur=ms=>{const m=Math.max(0,Math.round(ms/60000));return m<60?m+" мин":Math.floor(m/60)+" ч "+String(m%60).padStart(2,"0")+" мин"};
const clock=s=>{s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};
const e1rm=(w,r)=>r<=0||w<=0?0:(r===1?w:w*(1+r/30));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const dayStart=d=>{const x=new Date(d);x.setHours(0,0,0,0);return x.getTime()};
const daysSince=iso=>Math.round((dayStart(Date.now())-dayStart(iso))/864e5);
const same=(a,b)=>Math.abs(a-b)<1e-9;
const reps=r=>r[0]===r[1]?r[0]:r[0]+"–"+r[1];
const dn=n=>{const a=n%10,b=n%100;return a===1&&b!==11?"день":a>=2&&a<=4&&(b<10||b>=20)?"дня":"дней"};
function platesFor(w){
  if(w<=20) return w===20?"пустой гриф":"";
  let side=(w-20)/2;const out=[];
  for(const p of [25,20,15,10,5,2.5,1.25]){while(side>=p-1e-9){out.push(p);side-=p}}
  return side>0.01?"":"на сторону: "+out.map(fmtKg).join(" + ");
}
function toast(msg){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2400)}
const isBodyEq=eq=>eq==="bw"||eq==="body";

/* ---------- история упражнения и прогрессия ---------- */
// сессии упражнения, новые первыми: [{date, sets(только отмеченные), top}].
// Если указана тренировка (A/B/C), берутся её сессии: жим в A тяжёлый, в C объёмный, веса у них разные.
function sessionsFor(x,prog){
  const all=[];
  for(const w of S.workouts)for(const e of w.exercises||[])if(e.x===x){const d=e.sets.filter(s=>s.done);if(d.length){all.push({prog:w.prog,date:w.startedAt,sets:d,top:Math.max(...d.map(s=>s.w))});break}}
  if(prog){const own=all.filter(s=>s.prog===prog);if(own.length)return own}
  return all;
}
function lastSession(x){return sessionsFor(x)[0]||null}
/* Правило (ТЗ, раздел 2):
   • прибавка ровно на шаг, если во всех подходах сделан верх диапазона, и не чаще раза в 14 дней;
   • 2 тренировки подряд не дотянул низ диапазона → −5%, округление вверх до шага (80 → 77,5);
   • 14 дней считаются от последнего изменения веса (первая тренировка с текущим весом). */
function suggest(def){
  const ses=sessionsFor(def.x,def.prog);
  if(!ses.length) return {w:def.w0||0,r:def.r[0],hint:"first",prev:null};
  const W=ses[0].top;
  let since=ses[0].date;for(const s of ses){if(same(s.top,W))since=s.date;else break}
  const topSets=ses[0].sets.filter(s=>same(s.w,W));
  const avg=Math.round(topSets.reduce((a,s)=>a+s.r,0)/topSets.length);
  const r=Math.min(def.r[1],Math.max(def.r[0],avg));
  const step=def.step||0;
  const failed=s=>s.sets.some(x=>same(x.w,s.top)&&x.r<def.r[0]);
  if(step>0&&W>0&&ses.length>=2&&same(ses[1].top,W)&&failed(ses[0])&&failed(ses[1])){
    let w=ceilGrid(def.eq,W*0.95,step);
    if(w>=W)w=stepDown(def.eq,W,step);
    return {w:Math.max(0,w),r:def.r[0],hint:"down",prev:W};
  }
  const allTop=topSets.length>=def.s&&topSets.every(s=>s.r>=def.r[1]);
  if(allTop&&step>0){
    const d=daysSince(since);
    if(d>=PROG_DAYS){const w=stepUp(def.eq,W,step);return {w,r:def.r[0],hint:"up",prev:W,inc:r2(w-W)}}
    return {w:W,r:def.r[1],hint:"wait",left:PROG_DAYS-d,prev:W};
  }
  return {w:W,r,hint:"",prev:W};
}
function nextKey(){const last=S.workouts[0];if(!last||!ORDER.includes(last.prog))return "A";return ORDER[(ORDER.indexOf(last.prog)+1)%3]}
function lastDone(k){const w=S.workouts.find(x=>x.prog===k);return w?w.startedAt:null}
function bestBench(){let best=null;for(const w of S.workouts)for(const e of w.exercises||[])if(e.x===BENCH)for(const s of e.sets)if(s.done){const v=e1rm(s.w,s.r);if(!best||v>best.v)best={v,w:s.w,r:s.r,date:w.startedAt}}return best}
function tonnage(w){let t=0;for(const e of w.exercises||[])for(const s of e.sets)if(s.done)t+=s.w*s.r;return t}
function lastBest(x){let b=0;for(const w of S.workouts)for(const e of w.exercises||[])if(e.x===x)for(const s of e.sets)if(s.done)b=Math.max(b,e1rm(s.w,s.r));return b}

/* ---------- старт / финиш ---------- */
function buildEx(slot,prog){
  const d={...slotDef(slot),prog},sg=suggest(d);
  return {x:d.x,n:d.n,s:d.s,r:d.r,rest:d.rest,step:d.step,eq:d.eq,note:d.note,hint:sg.hint,prev:sg.prev??null,left:sg.left??null,inc:sg.inc??null,
    sets:Array.from({length:d.s},()=>({w:sg.w,r:sg.r,done:false}))};
}
function startWorkout(k){
  const p=S.program[k];
  S.active={id:uid(),prog:k,startedAt:new Date().toISOString(),exercises:p.ex.map(sl=>buildEx(sl,k))};
  saveActive();S.layerOpen=true;wake(true);renderLayer();
}
function finishWorkout(){
  const a=S.active;if(!a)return;
  const w={id:a.id,prog:a.prog,startedAt:a.startedAt,finishedAt:new Date().toISOString(),exercises:a.exercises.map(e=>({x:e.x,n:e.n,sets:e.sets.map(s=>({w:+s.w,r:+s.r,done:!!s.done}))}))};
  const prs=[];
  for(const e of w.exercises){const before=lastBest(e.x);const best=Math.max(0,...e.sets.filter(s=>s.done).map(s=>e1rm(s.w,s.r)));if(best>0&&before>0&&best>before+0.01)prs.push(e.n)}
  S.active=null;saveActive();stopRest();wake(false);
  saveWorkout(w);
  $("#layer").innerHTML="";
  showSummary(w,prs);render();
}

/* ---------- таймер отдыха, свисток, экран не гаснет ----------
   Таймер считает от времени окончания (timestamp), а не тиками: после YouTube или блокировки время верное.
   Звук «разблокируется» нажатием галочки. Пока приложение свёрнуто, свисток не звучит. */
let restTick=null,audio=null;
function ac(){if(!audio){const C=window.AudioContext||window.webkitAudioContext;if(C)audio=new C()}return audio}
function unlockAudio(){try{const a=ac();if(!a)return;if(a.state!=="running")a.resume();const b=a.createBuffer(1,1,22050),s=a.createBufferSource();s.buffer=b;s.connect(a.destination);s.start(0)}catch(e){}}
function whistle(){
  try{const a=ac();if(!a)return;if(a.state!=="running")a.resume();
    const t0=a.currentTime+0.03,out=a.createGain();out.gain.value=0.55;out.connect(a.destination);
    // судейский свисток: короткий, короткий, длинный; высокий тон с трелью шарика ~26 Гц
    [[0,.2],[.3,.2],[.6,.95]].forEach(([st,du])=>{const t=t0+st;
      const o=a.createOscillator();o.type="sine";o.frequency.setValueAtTime(2800,t);o.frequency.linearRampToValueAtTime(3000,t+du);
      const lfo=a.createOscillator();lfo.frequency.value=26;const fm=a.createGain();fm.gain.value=180;lfo.connect(fm);fm.connect(o.frequency);
      const am=a.createGain();am.gain.value=0.7;const lfo2=a.createOscillator();lfo2.frequency.value=26;const ag=a.createGain();ag.gain.value=0.3;lfo2.connect(ag);ag.connect(am.gain);
      const env=a.createGain();env.gain.setValueAtTime(0.0001,t);env.gain.exponentialRampToValueAtTime(1,t+0.02);env.gain.setValueAtTime(1,t+du-0.05);env.gain.exponentialRampToValueAtTime(0.0001,t+du);
      o.connect(am);am.connect(env);env.connect(out);
      [o,lfo,lfo2].forEach(n=>{n.start(t);n.stop(t+du+0.05)});
    });
  }catch(e){}
  try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}
}
const DIM_AFTER=8000; // через 8 секунд без касаний экран темнеет до чёрного
function startRest(sec,label){
  S.rest={end:Date.now()+sec*1000,total:sec,label,beeped:false,dimAt:Date.now()+DIM_AFTER,dim:false};S.go=false;
  LS.set("zal_rest",S.rest);clearInterval(restTick);restTick=setInterval(drawRest,250);drawRest();
}
function stopRest(){S.rest=null;S.go=false;LS.del("zal_rest");clearInterval(restTick);const r=$("#restbar");if(r)r.remove();drawDim()}
function drawRest(){
  if(!S.rest){drawDim();return}
  let el=$("#restbar");
  if(!el){el=document.createElement("div");el.id="restbar";el.className="restbar";el.innerHTML='<div class="in"><div class="time num"></div><div class="grow"><div class="lbl"></div><div class="prog"><i></i></div></div><button data-act="rest-add">+30 с</button><button data-act="rest-stop">Стоп</button></div>';document.body.appendChild(el)}
  const now=Date.now(),left=(S.rest.end-now)/1000;
  el.classList.toggle("over",left<=0);
  el.querySelector(".time").textContent=left>0?clock(left):"0:00";
  el.querySelector(".lbl").textContent=left>0?"Отдых · "+S.rest.label:"Погнали! Следующий подход";
  el.querySelector(".prog i").style.width=Math.max(0,Math.min(100,100*left/S.rest.total))+"%";
  if(left>0&&!S.rest.dim&&now>=S.rest.dimAt){S.rest.dim=true}
  if(left<=0&&!S.rest.beeped&&!document.hidden){
    S.rest.beeped=true;S.rest.dim=false;S.go=true;LS.set("zal_rest",S.rest);
    if(left>-3)whistle(); // если вернулся в приложение позже, без запоздалого свистка
    setTimeout(()=>{if(S.go){S.go=false;drawDim()}},8000);
  }
  if(left<-20){stopRest();return}
  drawDim();
}
function drawDim(){
  let el=$("#dim");
  const show=S.go||(S.rest&&S.rest.dim);
  if(!show){if(el)el.remove();return}
  if(!el){el=document.createElement("div");el.id="dim";el.setAttribute("data-act","undim");el.innerHTML='<div class="big"></div><div class="lbl"></div>';document.body.appendChild(el)}
  el.className="dim"+(S.go?" go":"");
  if(S.go){el.querySelector(".big").textContent="Погнали";el.querySelector(".lbl").textContent=S.rest?S.rest.label:""}
  else{el.querySelector(".big").textContent=clock((S.rest.end-Date.now())/1000);el.querySelector(".lbl").textContent="Отдых · коснись экрана"}
}
let lock=null;
async function wake(on){
  try{
    if(on){if(!("wakeLock" in navigator)||document.hidden)return;if(lock&&!lock.released)return;lock=await navigator.wakeLock.request("screen");lock.addEventListener("release",()=>{lock=null})}
    else if(lock){const l=lock;lock=null;await l.release()}
  }catch(e){}
}
function restoreRest(){const r=LS.get("zal_rest",null);if(r&&S.active&&Date.now()-r.end<20000){S.rest={...r,dim:false,dimAt:Date.now()+DIM_AFTER};clearInterval(restTick);restTick=setInterval(drawRest,250)}else LS.del("zal_rest")}
/* ---------- экраны ---------- */
function render(){
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-current",b.dataset.tab===S.tab?"page":"false"));

function storeNote(){
  if(S.dbState==="local") return '<div class="banner">Не удалось сохранить данные на телефоне.</div>';
  return "";
}
function vToday(){
  const planK=nextKey(),nk=S.pick||planK,p=S.program[nk];
  const d=new Date();
  const week=S.workouts.filter(w=>Date.now()-new Date(w.startedAt)<7*864e5).length;
  const bw=S.body.length?S.body[S.body.length-1].kg:null;
  const bb=bestBench();
  const pct=bb?Math.min(100,bb.v/GOAL_BENCH*100):0;
  return `
  <div class="top"><div><div class="eyebrow">${DOW[d.getDay()]}, ${d.getDate()} ${MON[d.getMonth()]}</div><h1>Привет, Бексултан</h1></div></div>
  <div class="stack">
  ${storeNote()}
  ${S.active?`<div class="card row between"><div><div class="eyebrow">Идёт тренировка</div><div style="font-weight:600">${S.program[S.active.prog].title}</div></div><button class="btn primary sm" data-act="resume">Продолжить</button></div>`:""}
  <div class="card next">
    <span class="plate lg p${nk}">${nk}</span>

    <button class="btn plate${nk} full" data-act="start" data-k="${nk}">Начать тренировку ${nk}</button>
    <button class="linkbtn" style="margin-top:8px" data-act="preview" data-k="${nk}">Посмотреть упражнения и веса</button>
  </div>
  <div class="section-title"><h2>Или выбери программу</h2></div>
  <div class="picker">${ORDER.map(k=>{const ld=lastDone(k);return `<button class="pick" data-act="pick" data-k="${k}" aria-current="${k===nk}"><span class="plate sm p${k}">${k}</span><span class="t">${S.program[k].focus}</span><span class="s">${ld?"была "+fdate(ld):"ещё не было"}</span></button>`}).join("")}</div>
  <div class="stats">

    <div class="bar"><i style="width:${pct}%"></i></div>

    <div class="muted" style="font-size:13px">${bb?`Расчётный максимум на 1 раз по лучшему подходу ${fmtKg(bb.w)}×${bb.r} (${fdate(bb.date)}). До цели ${fmtKg(Math.max(0,Math.round((GOAL_BENCH-bb.v)*2)/2))} кг.`:"Появится после первой тренировки с жимом лёжа."}</div>
  </div>
  <div class="muted num" style="text-align:center;font-size:11px"><span data-act="diag">версия 9 · ${S.workouts.length?"данные на телефоне":"данных пока нет"}</span>${S.diag?"<br>"+diag():""}</div>
  </div>`;
}
function diag(){

function vHistory(){
  if(!S.workouts.length) return `<div class="top"><h1>История</h1></div><div class="stack">${storeNote()}<div class="list"><div class="empty">Здесь появятся завершённые тренировки: дата, программа, время, тоннаж и все подходы.<br><br><button class="btn primary sm" data-tab-go="today">Начать первую</button></div></div>${backupCard()}</div>`;
  const groups={};

function backupCard(){
  return `<div class="card stack"><h2>Резервная копия</h2><div class="muted" style="font-size:13px">Данные хранятся в этом iPhone. Раз в неделю сохраняй копию в «Файлы» или отправляй в Telegram. Из копии всё восстанавливается.</div>

async function doBackup(){
  const data=JSON.stringify({app:"zal",version:2,exportedAt:new Date().toISOString(),workouts:S.workouts,body:S.body,program:S.program},null,1);
  const name="zal-backup-"+today()+".json";
  const file=new File([data],name,{type:"application/json"});
  try{ if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return} }catch(e){ if(e&&e.name==="AbortError")return; }
  const a=document.createElement("a");a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
}
async function doRestore(file){
  try{const j=JSON.parse(await file.text());if(!Array.isArray(j.workouts)||!Array.isArray(j.body))throw 0;
    const byId=new Map(S.workouts.map(w=>[w.id,w]));j.workouts.forEach(w=>byId.set(w.id,normWorkout(w)));
    S.workouts=[...byId.values()].sort((a,b)=>b.startedAt.localeCompare(a.startedAt));
    const byD=new Map(S.body.map(b=>[b.date,b]));j.body.forEach(b=>byD.set(b.date,b));

function allExerciseIds(){const set=new Set();ORDER.forEach(k=>S.program[k].ex.forEach(e=>set.add(e.x)));for(const w of S.workouts)for(const e of w.exercises||[])set.add(e.x);return [...set]}

function lineChart(pts,opt={}){
  const W=340,H=180,L=34,R=10,T=12,B=24;
  let ys=pts.map(p=>p.y);if(opt.goal)ys.push(opt.goal);if(opt.band)ys.push(...opt.band);
  let lo=Math.min(...ys),hi=Math.max(...ys);if(hi-lo<4){lo-=2;hi+=2}
  const span=hi-lo;const stepRaw=span/4;const mag=Math.pow(10,Math.floor(Math.log10(stepRaw)));const step=[1,2,2.5,5,10].map(m=>m*mag).find(s=>s>=stepRaw);
  lo=Math.floor(lo/step)*step;hi=Math.ceil(hi/step)*step;
  const x0=pts[0].x,x1=pts[pts.length-1].x;
  const sx=x=>x1===x0?L+(W-L-R)/2:L+(x-x0)/(x1-x0)*(W-L-R);
  const sy=y=>T+(hi-y)/(hi-lo)*(H-T-B);
  let g="";
  for(let v=lo;v<=hi+1e-9;v+=step){g+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${sy(v)}" y2="${sy(v)}"/><text x="${L-6}" y="${sy(v)+3}" text-anchor="end">${fmtKg(v)}</text>`}
  if(opt.band){g+=`<rect class="goalband" x="${L}" width="${W-L-R}" y="${sy(opt.band[1])}" height="${Math.max(2,sy(opt.band[0])-sy(opt.band[1]))}"/><text class="goaltext" x="${W-R}" y="${sy(opt.band[1])-4}" text-anchor="end">цель</text>`}
  if(opt.goal){g+=`<line class="goal" x1="${L}" x2="${W-R}" y1="${sy(opt.goal)}" y2="${sy(opt.goal)}"/><text class="goaltext" x="${W-R}" y="${sy(opt.goal)-4}" text-anchor="end">${opt.goalLabel}</text>`}
  const d=pts.map((p,i)=>(i?"L":"M")+sx(p.x).toFixed(1)+" "+sy(p.y).toFixed(1)).join(" ");
  const area=d+` L${sx(x1).toFixed(1)} ${H-B} L${sx(x0).toFixed(1)} ${H-B} Z`;
  const lp=pts[pts.length-1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="График">
    ${g}
    <path d="${area}" fill="var(--plate-a)" opacity=".10"/>
    <path d="${d}" fill="none" stroke="var(--plate-a)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map(p=>`<circle cx="${sx(p.x)}" cy="${sy(p.y)}" r="2.6" fill="var(--plate-a)"/>`).join("")}
    <circle cx="${sx(lp.x)}" cy="${sy(lp.y)}" r="5" fill="var(--surface)" stroke="var(--plate-a)" stroke-width="2.5"/>
    <text x="${L}" y="${H-6}">${pts[0].label}</text>${pts.length>1?`<text x="${W-R}" y="${H-6}" text-anchor="end">${lp.label}</text>`:""}
  </svg>`;
}

  const tabBtn=ev.target.closest("[data-tab]");if(tabBtn){S.tab=tabBtn.dataset.tab;closeSheet();render();window.scrollTo(0,0);return}
  const go=ev.target.closest("[data-tab-go]");if(go){S.tab=go.dataset.tabGo;render();return}
  unlockAudio();
  if(S.active)wake(true);
  const t=ev.target.closest("[data-act]");if(!t)return;
  const act=t.dataset.act,i=+t.dataset.i,j=+t.dataset.j;
  if(act==="close-sheet"&&ev.target!==t)return;
  switch(act){
    case "start":closeSheet();if(!S.active)startWorkout(t.dataset.k);break;
    case "preview":showPreview(t.dataset.k);break;
    case "pick":S.pick=t.dataset.k===nextKey()?null:t.dataset.k;render();break;
    case "resume":S.layerOpen=true;wake(true);renderLayer();break;
    case "minimize":S.layerOpen=false;$("#layer").innerHTML="";clearInterval(clockTick);render();break;
    case "w-":bump(i,j,"w",-1);break; case "w+":bump(i,j,"w",1);break;
    case "r-":bump(i,j,"r",-1);break; case "r+":bump(i,j,"r",1);break;
    case "done":{const e=S.active.exercises[i],s=e.sets[j];s.done=!s.done;saveActive();
      if(s.done){const nextUndone=e.sets.some(x=>!x.done);const label=nextUndone?e.n:"дальше: "+(S.active.exercises[i+1]?.n||"финиш");startRest(e.rest||90,label)}
      renderLayer();break;}
    case "set-add":{const e=S.active.exercises[i];const l=e.sets[e.sets.length-1];e.sets.push({w:l.w,r:l.r,done:false});saveActive();renderLayer();break}
    case "set-del":{const e=S.active.exercises[i];if(e.sets.length>1){e.sets.pop();saveActive();renderLayer()}break}
    case "swap":showSwap(i);break;
    case "swap-pick":showSwapMode(i,t.dataset.x);break;
    case "swap-do":doSwap(i,t.dataset.x,t.dataset.mode);break;
    case "prog-reset":{const k=t.dataset.k;S.program[k]=clone(PROGRAM_DEFAULT[k]);saveProgram();showPreview(k);render();toast("Программа как раньше");break}
    case "undim":if(S.go){S.go=false}else if(S.rest){S.rest.dim=false;S.rest.dimAt=Date.now()+DIM_AFTER}drawDim();break;
    case "rest-add":if(S.rest){S.rest.end=Math.max(S.rest.end,Date.now())+30000;S.rest.total+=30;S.rest.beeped=false;S.go=false;LS.set("zal_rest",S.rest);drawRest()}break;
    case "rest-stop":stopRest();break;
    case "finish-ask":showFinishAsk();break;
    case "finish":closeSheet();finishWorkout();break;
    case "discard":S.active=null;saveActive();stopRest();wake(false);closeSheet();$("#layer").innerHTML="";clearInterval(clockTick);render();toast("Тренировка отменена");break;
    case "close-sheet":case "close-sheet-btn":closeSheet();break;
    case "hist":showHist(t.dataset.id);break;
    case "hist-del":showHist(t.dataset.id,true);break;
    case "hist-del-yes":deleteWorkout(t.dataset.id);closeSheet();render();toast("Тренировка удалена");break;
    case "backup":doBackup();break;
    case "diag":S.diag=!S.diag;render();break;
    case "bw-del":deleteBody(t.dataset.d);render();break;
  }
});
document.addEventListener("change",ev=>{
  const el=ev.target;
  if(el.dataset&&el.dataset.f&&S.active){const s=S.active.exercises[+el.dataset.i].sets[+el.dataset.j];const v=parseFloat(String(el.value).replace(",","."));if(!isNaN(v)&&v>=0){s[el.dataset.f]=el.dataset.f==="r"?Math.round(v):v;saveActive()}renderLayer();return}
  if(el.id==="restoreFile"&&el.files&&el.files[0]){doRestore(el.files[0]);el.value="";return}
  if(el.id==="progSel"){S.progEx=el.value;LS.set("zal_progEx",el.value);render()}
});
document.addEventListener("submit",ev=>{
  if(ev.target.id!=="bwForm")return;ev.preventDefault();
  const kg=parseFloat(String($("#bwKg").value).replace(",","."));const date=$("#bwDate").value||today();
  if(isNaN(kg)||kg<30||kg>250){toast("Введи вес от 30 до 250 кг");return}
  saveBody(date,Math.round(kg*10)/10);render();toast("Вес записан");
});
// возврат в приложение (например, после YouTube): снова запрещаем гаснуть экрану, таймер показывает верное время
document.addEventListener("visibilitychange",()=>{if(document.hidden)return;if(S.active)wake(true);try{audio&&audio.state!=="running"&&audio.resume()}catch(e){}if(S.rest)drawRest()});

restoreRest();
render();
if("serviceWorker" in navigator){
  const had=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{if(had&&!S.active&&!window.__rl){window.__rl=1;location.reload()}});
  addEventListener("load",()=>navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(r=>r.update()).catch(()=>{}));
}
</script>
</body>
</html>
