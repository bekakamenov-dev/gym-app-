<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Зал</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Зал">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#1e2124">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png?v=10">
<link rel="icon" href="icon-192.png?v=10">
<style>:root{padding:0;--gap:0px;--top:max(calc(env(safe-area-inset-top,0px) - 12px),0px);--bot:calc(env(safe-area-inset-bottom,0px)*.4)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sofia+Sans:wght@400;500;600;700;800&family=Sofia+Sans+Extra+Condensed:wght@700;800&display=swap">
<style>
/* «Гриф и мел» (v7). Графит, сталь и мел; цвета блинов A/B/C = красный 25, синий 20, жёлтый 15 кг.
   Одна смелая деталь: на главном экране герой на сцене (v18), свет под ним цвета блина следующей тренировки. Остальное спокойно.
   Шрифт один: Sofia Sans; узкая версия (Extra Condensed) для весов, таймера и заголовков, как табло в зале. */
:root{
  --bg:#e3e5e6; --surface:#f2f3f3; --surface-2:#d6d9db; --line:#c5c9cc;
  --fg:#1e2124; --muted:#565d64; --faint:#80878e;
  --steel-1:#9aa1a7; --steel-2:#c9cdd0; --steel-3:#6f767c;
  --plate-a:#cf3326; --plate-b:#2457c8; --plate-c:#c9940c; --plate-g:#2b8a4c;
  --on-plate:#ffffff; --ok:#2b8a4c; --warn:#c9940c;
  --shadow:none;
  --f-display:"Sofia Sans Extra Condensed","Sofia Sans",system-ui,sans-serif;
  --f-body:"Sofia Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"Sofia Sans Extra Condensed","Sofia Sans",system-ui,sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1e2124; --surface:#272b2f; --surface-2:#32373c; --line:#3a4046;
  --fg:#eceae4; --muted:#a3a7aa; --faint:#767c82;
  --steel-1:#5d646a; --steel-2:#8d949a; --steel-3:#454b50;
  --plate-a:#e8483a; --plate-b:#3f78ea; --plate-c:#e4b12a; --plate-g:#46b06a;
  --on-plate:#ffffff; --ok:#46b06a; --warn:#e4b12a;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#1e2124; --surface:#272b2f; --surface-2:#32373c; --line:#3a4046;
  --fg:#eceae4; --muted:#a3a7aa; --faint:#767c82;
  --steel-1:#5d646a; --steel-2:#8d949a; --steel-3:#454b50;
  --plate-a:#e8483a; --plate-b:#3f78ea; --plate-c:#e4b12a; --plate-g:#46b06a;
  --on-plate:#ffffff; --ok:#46b06a; --warn:#e4b12a;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:var(--top);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible,label:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
input,select{font:inherit;color:inherit}
.app{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(var(--top) + 4px) calc(92px + var(--bot))}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:700}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--f-display);font-weight:800;font-size:38px;line-height:.95;letter-spacing:0}
h2{font-family:var(--f-body);font-weight:700;font-size:17px}
.eyebrow{font-size:14px;font-weight:500;color:var(--muted)}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding-block:10px 8px}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--surface);border:1.5px solid var(--line);font-weight:800;font-size:18px;color:var(--fg);flex:none}
.top > .muted, .top > .num{font-family:var(--f-num);font-weight:700;font-size:20px}
.card{background:var(--surface);border-radius:var(--r);padding:16px}
.section-title{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px}
.banner{font-size:14px;border-left:3px solid var(--plate-c);background:var(--surface);border-radius:4px;padding:10px 12px;color:var(--fg)}

/* блин: вид сверху, с ободом и втулкой */
.plate{--c:var(--plate-a);display:inline-grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--c);color:var(--on-plate);font-family:var(--f-display);font-weight:800;font-size:19px;line-height:1;flex:none;box-shadow:inset 0 0 0 3px color-mix(in srgb,#000 22%,var(--c)),inset 0 0 0 5px color-mix(in srgb,#fff 18%,var(--c))}
.plate.sm{width:28px;height:28px;font-size:15px;box-shadow:inset 0 0 0 2px color-mix(in srgb,#000 22%,var(--c))}
.plate.lg{width:56px;height:56px;font-size:28px}
.pA{--c:var(--plate-a)} .pB{--c:var(--plate-b)} .pC{--c:var(--plate-c)} .pD{--c:var(--plate-g)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 18px;border-radius:12px;font-weight:700;font-size:17px}
.btn.primary{background:var(--fg);color:var(--bg)}
.btn.plateA{background:var(--plate-a);color:var(--on-plate)}
.btn.plateB{background:var(--plate-b);color:var(--on-plate)}
.btn.plateC{background:var(--plate-c);color:var(--on-plate)}
.btn.plateD{background:var(--plate-g);color:var(--on-plate)}
.btn.ghost{background:var(--surface-2)}
.btn.danger{background:transparent;color:var(--plate-a);border:1.5px solid var(--plate-a)}
.btn.full{width:100%}
.btn.sm{min-height:38px;font-size:15px;padding:0 13px;border-radius:10px}



.goal{display:flex;flex-direction:column;gap:8px}
.goal .row .num{font-size:26px}
/* прогресс к цели как гриф с насечкой */
.bar{height:12px;border-radius:3px;background:repeating-linear-gradient(90deg,transparent 0 3px,rgba(0,0,0,.12) 3px 4px),var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--plate-a);border-radius:3px}
.ticks{display:flex;justify-content:space-between;font-size:14px;color:var(--faint)}

/* нижняя панель */
.tabs{position:fixed;left:0;right:0;bottom:calc(0px - var(--gap));z-index:20;background:var(--bg);border-top:1.5px solid var(--line);padding-bottom:var(--bot);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs nav{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 8px;font-size:10.5px;color:var(--faint);font-weight:600}
.tabs button[aria-current="page"]{color:var(--fg)}
.tabs button[aria-current="page"]::before{content:"";position:absolute;top:-1.5px;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--fg)}
.tabs svg{width:24px;height:24px}

/* списки */
.list{display:flex;flex-direction:column;background:var(--surface);border-radius:var(--r);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:13px 14px;border-top:1px solid var(--line);text-align:left;width:100%}
.item:first-child{border-top:0}
.item .grow{flex:1;min-width:0}
.item .t{font-weight:700}
.item .s{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item > .num{font-size:20px}
.chev{color:var(--faint);font-size:22px}

/* экран тренировки */
.layer{position:fixed;inset:0 0 calc(0px - var(--gap)) 0;z-index:40;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;padding-top:var(--top)}
.layer-in{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(140px + var(--bot))}
.whead{position:sticky;top:0;z-index:5;background:var(--bg);padding-block:12px 10px;display:flex;align-items:center;gap:12px;border-bottom:1.5px solid var(--line)}
.whead .grow{flex:1;min-width:0}
.whead .clock{font-family:var(--f-num);font-weight:700;font-size:17px;color:var(--muted);white-space:nowrap}
.whead .ttl{font-weight:800;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:42px;height:38px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;flex:none}
.iconbtn svg{width:20px;height:20px}
.ex{background:var(--surface);border-radius:var(--r);padding:16px 14px 12px;display:flex;flex-direction:column;gap:12px}
.ex.done{opacity:.6}
.ex-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ex-h .t{font-family:var(--f-display);font-weight:800;font-size:26px;line-height:1}
.ex-h .s{font-size:14px;color:var(--muted);margin-top:4px}
.hint{font-size:13px;font-weight:700;border-radius:8px;padding:4px 9px;background:var(--surface-2);white-space:nowrap}
.hint.up{background:var(--ok);color:#fff}
.sets{display:flex;flex-direction:column;gap:8px}
.set{display:grid;grid-template-columns:20px 1fr 1fr 54px;gap:8px;align-items:center}
.set .n{font-family:var(--f-num);font-weight:700;font-size:18px;color:var(--faint);text-align:center}
.step{display:grid;grid-template-columns:36px 1fr 36px;align-items:center;background:var(--surface-2);border-radius:10px;height:54px;min-width:0}
.step button{height:100%;font-size:22px;color:var(--muted)}
.step input{width:100%;min-width:0;height:30px;line-height:30px;border:0;background:transparent;text-align:center;font-family:var(--f-num);font-weight:800;font-size:30px;padding:0;-moz-appearance:textfield}
.step input::-webkit-outer-spin-button,.step input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.step small{display:block;text-align:center;font-size:11px;line-height:13px;color:var(--faint);pointer-events:none}
.unit{display:flex;flex-direction:column;justify-content:center;line-height:1.1}
.check{height:54px;border-radius:50%;width:54px;border:2px solid var(--line);display:grid;place-items:center;color:var(--faint)}
.check svg{width:24px;height:24px}
.set.is-done .check{background:var(--ok);border-color:var(--ok);color:#fff}
.set.is-done .step{background:color-mix(in srgb,var(--ok) 14%,var(--surface-2))}
.plates{font-size:14px;color:var(--muted)}
.ex-f{display:flex;gap:8px;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:8px}
.linkbtn{font-size:15px;font-weight:700;color:var(--fg);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:4px;padding:6px 0}
.ex-f .row{gap:16px}

/* таймер отдыха: табло */
.restbar{position:fixed;left:0;right:0;bottom:calc(0px - var(--gap));z-index:45;background:var(--fg);color:var(--bg);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(12px + var(--bot)) max(16px,env(safe-area-inset-left,0px))}
.restbar .in{max-width:520px;margin:0 auto;display:flex;align-items:center;gap:12px}
.restbar .time{font-family:var(--f-num);font-size:52px;line-height:1;font-weight:800;font-variant-numeric:tabular-nums;min-width:104px}
.restbar .grow{flex:1;min-width:0}
.restbar .lbl{font-size:14px;opacity:.8}
.restbar .prog{height:5px;background:color-mix(in srgb,var(--bg) 25%,transparent);border-radius:3px;margin-top:6px;overflow:hidden}
.restbar .prog i{display:block;height:100%;background:var(--bg)}
.restbar button{background:color-mix(in srgb,var(--bg) 16%,transparent);color:var(--bg);border-radius:10px;min-height:44px;padding:0 12px;font-weight:700;font-size:15px}
.restbar.over{background:var(--ok);color:#fff}
.restbar.over button{color:#fff}

/* нижние окна */
.scrim{position:fixed;inset:0 0 calc(0px - var(--gap)) 0;z-index:60;background:rgba(14,16,18,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));max-height:88vh;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.sheet h1{font-size:30px!important}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-block:1.5px solid var(--line);padding-block:10px}
.kv div{padding:0 12px;border-left:1.5px solid var(--line)}
.kv div:first-child{border-left:0;padding-left:2px}
.kv b{display:block;font-family:var(--f-num);font-size:30px;line-height:1.05;font-weight:800}
.kv span{font-size:13px;color:var(--muted)}
.exlog{display:flex;flex-direction:column;gap:6px}
.exlog .r{display:flex;justify-content:space-between;gap:12px;font-size:15px;border-top:1px solid var(--line);padding-top:7px}
.exlog .r:first-child{border-top:0}
.exlog .r span:last-child{font-family:var(--f-num);font-weight:700;font-size:17px;color:var(--muted);text-align:right}
.pr{color:var(--plate-a);font-weight:800}

/* формы */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;color:var(--muted);font-weight:600}
.inp{height:50px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);padding:0 14px;font-size:18px;width:100%;min-width:0}
.inp.num{font-size:20px}
.bwform{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end}
select.inp{appearance:none;font-weight:600;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 22px,calc(100% - 15px) 22px;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}

.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--f-num);font-weight:700;font-size:12px}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .goal{stroke:var(--plate-g);stroke-dasharray:4 4;stroke-width:1.5}
.chart .goalband{fill:var(--plate-g);opacity:.14}
.chart .goaltext{fill:var(--plate-g)}
.empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:15px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + var(--bot) - var(--gap));z-index:80;background:var(--fg);color:var(--bg);padding:11px 18px;border-radius:12px;font-size:15px;font-weight:700}
@media (max-width:380px){.set{grid-template-columns:16px 1fr 1fr 48px;gap:6px}.step{grid-template-columns:28px 1fr 28px}.check{width:48px;height:48px}.step input{font-size:26px}}
@media (prefers-reduced-motion:no-preference){.ex,.pick,.btn,.check{transition:background-color .15s,opacity .15s,transform .1s}.btn:active,.check:active,.pick:active{transform:scale(.97)}}
/* v8: «Как делать», «Заменить», подсказки прогрессии, затемнение и «Погнали» */
.ex-a{display:flex;gap:8px;flex-wrap:wrap;margin-top:-2px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 13px;border-radius:10px;background:var(--surface-2);font-size:15px;font-weight:700;color:var(--fg);text-decoration:none}
.chip svg{width:15px;height:15px;flex:none}
.hint.down{background:var(--warn);color:#1e2124}
.vlink{display:inline-grid;place-items:center;width:26px;height:26px;margin-right:6px;border-radius:7px;background:var(--surface-2);color:var(--fg);vertical-align:-7px}
.vlink svg{width:12px;height:12px}
.dim{position:fixed;inset:0 0 calc(0px - var(--gap)) 0;z-index:70;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px;cursor:pointer}
.dim .big{font-family:var(--f-num);font-weight:800;font-size:132px;line-height:1;color:#43484d;font-variant-numeric:tabular-nums}
.dim .lbl{font-size:16px;color:#43484d;font-weight:600;max-width:320px}
.dim.go{background:var(--plate-g)}
.dim.go .big{font-family:var(--f-display);font-size:104px;color:#fff;text-transform:uppercase;letter-spacing:.01em}
.dim.go .lbl{color:#fff;opacity:.9}
@media (prefers-reduced-motion:no-preference){.dim.go .big{animation:go .5s ease-out}@keyframes go{from{transform:scale(.8);opacity:.3}to{transform:none;opacity:1}}}
/* v12: программа, знакомство, профиль, цели, групповые */
.avatar{overflow:hidden;padding:0;display:grid;place-items:center}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar.xl{width:84px;height:84px;font-size:34px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip[aria-pressed="true"],.chip.on{background:var(--fg);color:var(--bg)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border-radius:12px;padding:3px;gap:3px}
.seg button{min-height:40px;border-radius:9px;font-weight:700;font-size:15px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg)}
.onb{position:fixed;inset:0 0 calc(0px - var(--gap)) 0;z-index:50;background:var(--bg);overflow-y:auto;padding-top:var(--top)}
.onb-in{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:16px;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.onb h1{font-size:40px}
.dots{display:flex;gap:6px}.dots i{flex:1;height:4px;border-radius:2px;background:var(--surface-2)}.dots i.on{background:var(--fg)}
.big-opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:16px}
.big-opt[aria-pressed="true"]{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
.big-opt .t{font-weight:800;font-size:18px}.big-opt .s{font-size:14px;color:var(--muted)}
.tag{display:inline-block;font-size:12px;font-weight:800;border-radius:6px;padding:2px 7px;background:var(--plate-g);color:#fff;vertical-align:2px;margin-left:6px}
.pslot{display:flex;align-items:center;gap:8px;padding:11px 12px;border-top:1px solid var(--line)}
.pslot:first-child{border-top:0}
.pslot .grow{flex:1;min-width:0}.pslot .t{font-weight:700;line-height:1.2}.pslot .s{font-size:13px;color:var(--muted)}
.mini{width:34px;height:34px;border-radius:9px;background:var(--surface-2);display:grid;place-items:center;font-size:16px;font-weight:800;color:var(--fg);flex:none}
.mini[disabled]{opacity:.3}
.mini.del{color:var(--plate-a)}
.weekdots{display:flex;gap:6px}.weekdots i{width:22px;height:22px;border-radius:50%;border:2px solid var(--line)}.weekdots i.on{background:var(--plate-g);border-color:var(--plate-g)}
.stepper{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;background:var(--surface-2);border-radius:10px;height:50px}
.stepper button{height:100%;font-size:22px;color:var(--muted)}
.stepper b{text-align:center;font-family:var(--f-num);font-size:26px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* v13: награды, окно поздравления, медали */
/* семья */
.list.flat{background:none;border-radius:0}
.list.flat .item{padding-inline:0}
.chal .place{width:18px;text-align:center;font-size:20px;color:var(--muted)}
.chal.lead .place{color:var(--fg)}
.chal .bar{display:block;height:8px;margin-top:6px}
.chal.lead .bar i{background:var(--plate-c)}
.chal .cnt{font-size:26px;min-width:28px;text-align:right}
.chal.off{opacity:.6}
.feed{align-items:flex-start}

.lvup{display:flex;align-items:flex-end;justify-content:center;gap:10px;padding:4px 0}.lvup .figw:first-child{opacity:.45}.lvup .arr{font-size:28px;color:var(--muted);align-self:center}
.like{display:flex;gap:12px;align-items:center;background:var(--surface-2);border-radius:14px;padding:10px 14px;font-size:15px;line-height:1.25}.like .e{font-size:34px;line-height:1}

.trk .ts{font-size:12.5px;color:var(--muted);line-height:1.2}
.trk.lock .tn{color:var(--muted)}
/* значок-награда: 3D-картинка на подставке цвета ступени, число на ленточке снизу */
.badge{--c:#b87333;--c2:#7a4a22;position:relative;display:grid;place-items:center;width:60px;height:60px;border-radius:50%;flex:none;
  background:radial-gradient(circle at 50% 35%,color-mix(in srgb,#fff 35%,var(--c)),var(--c) 55%,var(--c2));box-shadow:inset 0 0 0 3px color-mix(in srgb,#fff 25%,var(--c2)),0 2px 6px rgba(0,0,0,.25)}
.badge img{width:78%;height:78%;object-fit:contain;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
.badge b{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);min-width:26px;padding:1px 6px;border-radius:8px;background:#1e2124;color:#fff;font-family:var(--f-num);font-size:14px;font-weight:800;line-height:16px;text-align:center;box-shadow:0 0 0 2px var(--c)}

.badge.off{--c:var(--surface-2);--c2:var(--line);box-shadow:inset 0 0 0 2px var(--line)}.badge.off img{filter:grayscale(1);opacity:.35}.badge.off b{background:var(--faint)}

.item .fs{display:block;font-size:13.5px;color:var(--muted);line-height:1.35;margin-top:2px}
.figw.fam{width:40px;height:60px;overflow:hidden}.figw.fam img{height:100%;width:auto;max-width:100%;object-fit:contain}
/* v18: главная. Одна смелая деталь — герой на сцене: под ним пятно света цвета блина следующей тренировки.

.stage{position:relative;overflow:hidden;display:grid;grid-template-columns:112px 1fr;grid-template-rows:1fr auto auto;column-gap:14px;padding:16px 16px 14px 8px;
  background:radial-gradient(70px 18px at 64px calc(100% - 12px),color-mix(in srgb,var(--c) 70%,transparent),transparent 75%),

.stage .go{margin-top:12px;min-height:52px;font-size:18px}
.stage .linkbtn{justify-self:start;margin-top:8px;font-size:14px}
.stage .linkbtn{text-align:left}
@media (max-width:380px){.stage{grid-template-columns:96px 1fr;column-gap:10px}.stage .figw{width:96px;height:180px}.stage h1{font-size:31px}}
.stage.nohero{grid-template-columns:1fr;grid-template-rows:auto;padding-left:16px;background:var(--surface)}
.wpick{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.wpick::-webkit-scrollbar{display:none}
.wp{flex:none;display:flex;align-items:center;gap:7px;min-height:46px;padding:0 13px 0 5px;border-radius:999px;border:1.5px solid var(--line);font-weight:700;font-size:15px;white-space:nowrap}
.wp .plate{width:34px;height:34px;font-size:17px}
.wpick .wp.add{padding:0 14px}
.wp .s{font-weight:500;color:var(--muted);font-size:13px}
.wp[aria-current="true"]{border-color:var(--fg);background:var(--surface)}
.wp.add{padding:0 16px;color:var(--muted)}
.wk{display:flex;flex-direction:column;gap:12px;width:100%;text-align:left}
.wk .lv{display:grid;grid-template-columns:auto 1fr auto;gap:8px 12px;align-items:center}
.wk .lv .nm{font-weight:800;font-size:16px;line-height:1.1}
.wk .lv .nm span{font-weight:500;color:var(--muted)}
.wk .lv .bar{height:8px;grid-column:1/-1}
.wk .lv .to{grid-column:3;grid-row:1;text-align:right;font-size:13px;color:var(--muted)}
.wk .lv .to b{font-family:var(--f-num);font-size:17px;color:var(--fg)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;justify-items:center}
.days .d{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--faint)}
.days .o{--c:var(--surface-2);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:17px;color:var(--on-plate);border:2px dashed var(--line)}
.days .o.done{background:var(--c);border:0;box-shadow:inset 0 0 0 3px color-mix(in srgb,#000 22%,var(--c)),inset 0 0 0 5px color-mix(in srgb,#fff 18%,var(--c))}
.days .o.frz{border:2px solid #7fb4d8;color:#7fb4d8;font-size:16px}
.days .d.today{color:var(--fg);font-weight:700}
.days .d.today .o:not(.done){border:2px solid var(--fg)}
.wk .foot{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:var(--muted)}
.wk .foot b{color:var(--fg)}
.ico{display:inline-block;width:18px;height:18px;vertical-align:-4px;margin-right:3px;object-fit:contain}

  for(const r of b.data){if(pending.has("b:"+r.date))continue;if(r.deleted)B.delete(r.date);else B.set(r.date,{id:r.date,date:r.date,kg:+r.kg})}

  const np=p.data&&normProgram(p.data.data);

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);

function platesFor(w){
  if(w<=20) return w===20?"пустой гриф":"";
  let side=(w-20)/2;const out=[];
  for(const p of [25,20,15,10,5,2.5,1.25]){while(side>=p-1e-9){out.push(p);side-=p}}

const isBodyEq=eq=>eq==="bw"||eq==="body";

/* ---------- история упражнения и прогрессия ---------- */
// сессии упражнения, новые первыми: [{date, sets(только отмеченные), top}].
// Если указана тренировка (A/B/C), берутся её сессии: жим в A тяжёлый, в C объёмный, веса у них разные.
function sessionsFor(x,prog){
  const all=[];
  for(const w of S.workouts)for(const e of w.exercises||[])if(e.x===x){const d=e.sets.filter(s=>s.done);if(d.length){all.push({prog:w.prog,date:w.startedAt,sets:d,top:Math.max(...d.map(s=>s.w))});break}}
  if(prog){const own=all.filter(s=>s.prog===prog);if(own.length)return own}
  return all;
}
function lastSession(x){return sessionsFor(x)[0]||null}
// вес для первого раза: из шаблона; для женского профиля вдвое меньше (с округлением вниз по шагу), штанга не легче грифа.
// В шаблоне для новичка веса и так лёгкие, там не уменьшаем.
function startW(def){
  let w=def.w0||0;if(!w||isBodyEq(def.eq))return w;
  if(S.prof.sex==="f"&&S.program.tpl!=="novice"){const st=def.step||2.5;w=def.eq==="dumb"?Math.max(1,Math.floor(w/2)):Math.floor(w/2/st+1e-9)*st;if(def.eq==="bar")w=Math.max(20,w)}
  return r2(w);
}
/* Правило (ТЗ, раздел 2):
   • прибавка ровно на шаг, если во всех подходах сделан верх диапазона, и не чаще раза в 14 дней;
   • 2 тренировки подряд не дотянул низ диапазона → −5%, округление вверх до шага (80 → 77,5);
   • 14 дней считаются от последнего изменения веса (первая тренировка с текущим весом). */
function suggest(def){
  const ses=sessionsFor(def.x,def.prog);
  if(!ses.length) return {w:startW(def),r:def.r[0],hint:"first",prev:null};
  const W=ses[0].top;
  let since=ses[0].date;for(const s of ses){if(same(s.top,W))since=s.date;else break}
  const topSets=ses[0].sets.filter(s=>same(s.w,W));
  const avg=Math.round(topSets.reduce((a,s)=>a+s.r,0)/topSets.length);
  const r=Math.min(def.r[1],Math.max(def.r[0],avg));
  const step=def.step||0;
  const failed=s=>s.sets.some(x=>same(x.w,s.top)&&x.r<def.r[0]);
  if(step>0&&W>0&&ses.length>=2&&same(ses[1].top,W)&&failed(ses[0])&&failed(ses[1])){
    let w=ceilGrid(def.eq,W*0.95,step);
    if(w>=W)w=stepDown(def.eq,W,step);
    return {w:Math.max(0,w),r:def.r[0],hint:"down",prev:W};
  }
  const allTop=topSets.length>=def.s&&topSets.every(s=>s.r>=def.r[1]);
  if(allTop&&step>0){
    const d=daysSince(since);
    if(d>=PROG_DAYS){const w=stepUp(def.eq,W,step);return {w,r:def.r[0],hint:"up",prev:W,inc:r2(w-W)}}
    return {w:W,r:def.r[1],hint:"wait",left:PROG_DAYS-d,prev:W};
  }
  return {w:W,r,hint:"",prev:W};

function monthCounts(rows,before){const by={};for(const r of rows){const d=new Date(r.started_at);if(before&&d>=new Date(before))continue;const m=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");(by[m]=by[m]||{})[r.user_id]=(by[m][r.user_id]||0)+1}return by}
function winsFor(by,uid){const wins=[];
  for(const [m,u] of Object.entries(by)){const c=Object.values(u);if(c.length<2)continue;const mx=Math.max(...c);
    if((u[uid]||0)===mx){const [y,mm]=m.split("-").map(Number);wins.push({m,at:new Date(y,mm,1,9).toISOString()})}}
  return wins.sort((a,b)=>a.m.localeCompare(b.m))}

  const {data,error}=await sb.from("workouts").select("user_id,started_at").eq("deleted",false).lt("started_at",m0).range(0,9999);
  if(error||!data)return;

/* ---------- таймер отдыха, свисток, экран не гаснет ----------
   Таймер считает от времени окончания (timestamp), а не тиками: после YouTube или блокировки время верное.
   Звук «разблокируется» нажатием галочки. Пока приложение свёрнуто, свисток не звучит. */
let restTick=null,audio=null;
function ac(){if(!audio){const C=window.AudioContext||window.webkitAudioContext;if(C)audio=new C()}return audio}
function unlockAudio(){try{const a=ac();if(!a)return;if(a.state!=="running")a.resume();const b=a.createBuffer(1,1,22050),s=a.createBufferSource();s.buffer=b;s.connect(a.destination);s.start(0)}catch(e){}}
function whistle(){
  try{const a=ac();if(!a)return;if(a.state!=="running")a.resume();
    const t0=a.currentTime+0.03,out=a.createGain();out.gain.value=0.55;out.connect(a.destination);
    // судейский свисток: короткий, короткий, длинный; высокий тон с трелью шарика ~26 Гц
    [[0,.2],[.3,.2],[.6,.95]].forEach(([st,du])=>{const t=t0+st;
      const o=a.createOscillator();o.type="sine";o.frequency.setValueAtTime(2800,t);o.frequency.linearRampToValueAtTime(3000,t+du);
      const lfo=a.createOscillator();lfo.frequency.value=26;const fm=a.createGain();fm.gain.value=180;lfo.connect(fm);fm.connect(o.frequency);
      const am=a.createGain();am.gain.value=0.7;const lfo2=a.createOscillator();lfo2.frequency.value=26;const ag=a.createGain();ag.gain.value=0.3;lfo2.connect(ag);ag.connect(am.gain);
      const env=a.createGain();env.gain.setValueAtTime(0.0001,t);env.gain.exponentialRampToValueAtTime(1,t+0.02);env.gain.setValueAtTime(1,t+du-0.05);env.gain.exponentialRampToValueAtTime(0.0001,t+du);
      o.connect(am);am.connect(env);env.connect(out);
      [o,lfo,lfo2].forEach(n=>{n.start(t);n.stop(t+du+0.05)});
    });
  }catch(e){}
  try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}
}

}
function stopRest(){S.rest=null;S.go=false;LS.del("zal_rest");clearInterval(restTick);const r=$("#restbar");if(r)r.remove();drawDim()}
function drawRest(){
  if(!S.rest){drawDim();return}
  let el=$("#restbar");
  if(!el){el=document.createElement("div");el.id="restbar";el.className="restbar";el.innerHTML='<div class="in"><div class="time num"></div><div class="grow"><div class="lbl"></div><div class="prog"><i></i></div></div><button data-act="rest-add">+30 с</button><button data-act="rest-stop">Стоп</button></div>';document.body.appendChild(el)}

async function doBackup(){
  const data=JSON.stringify({app:"zal",version:2,exportedAt:new Date().toISOString(),workouts:S.workouts,body:S.body,program:S.program,profile:S.prof},null,1);
  const name="zal-backup-"+today()+".json";
  const file=new File([data],name,{type:"application/json"});
  try{ if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return} }catch(e){ if(e&&e.name==="AbortError")return; }
  const a=document.createElement("a");a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
}
async function doRestore(file){
  try{const j=JSON.parse(await file.text());if(!Array.isArray(j.workouts)||!Array.isArray(j.body))throw 0;
    const byId=new Map(S.workouts.map(w=>[w.id,w]));j.workouts.forEach(w=>byId.set(w.id,normWorkout(w)));
    S.workouts=[...byId.values()].sort((a,b)=>b.startedAt.localeCompare(a.startedAt));

    S.body=[...byD.values()].sort((a,b)=>a.date.localeCompare(b.date));
    const np=normProgram(j.program);if(np){S.program=np;saveProgram()}
    if(j.profile&&typeof j.profile==="object"&&Object.keys(j.profile).length){S.prof={...S.prof,...j.profile};saveProfile()}
    persist("zal_workouts",S.workouts);persist("zal_body",S.body);

}

function lineChart(pts,opt={}){
  const W=340,H=180,L=34,R=10,T=12,B=24;
  let ys=pts.map(p=>p.y);if(opt.goal)ys.push(opt.goal);if(opt.band)ys.push(...opt.band);
  let lo=Math.min(...ys),hi=Math.max(...ys);if(hi-lo<4){lo-=2;hi+=2}
  const span=hi-lo;const stepRaw=span/4;const mag=Math.pow(10,Math.floor(Math.log10(stepRaw)));const step=[1,2,2.5,5,10].map(m=>m*mag).find(s=>s>=stepRaw);
  lo=Math.floor(lo/step)*step;hi=Math.ceil(hi/step)*step;
  const x0=pts[0].x,x1=pts[pts.length-1].x;
  const sx=x=>x1===x0?L+(W-L-R)/2:L+(x-x0)/(x1-x0)*(W-L-R);
  const sy=y=>T+(hi-y)/(hi-lo)*(H-T-B);
  let g="";
  for(let v=lo;v<=hi+1e-9;v+=step){g+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${sy(v)}" y2="${sy(v)}"/><text x="${L-6}" y="${sy(v)+3}" text-anchor="end">${fmtKg(v)}</text>`}
  if(opt.band){g+=`<rect class="goalband" x="${L}" width="${W-L-R}" y="${sy(opt.band[1])}" height="${Math.max(2,sy(opt.band[0])-sy(opt.band[1]))}"/><text class="goaltext" x="${W-R}" y="${sy(opt.band[1])-4}" text-anchor="end">цель</text>`}
  if(opt.goal){g+=`<line class="goal" x1="${L}" x2="${W-R}" y1="${sy(opt.goal)}" y2="${sy(opt.goal)}"/><text class="goaltext" x="${W-R}" y="${sy(opt.goal)-4}" text-anchor="end">${opt.goalLabel}</text>`}
  const d=pts.map((p,i)=>(i?"L":"M")+sx(p.x).toFixed(1)+" "+sy(p.y).toFixed(1)).join(" ");
  const area=d+` L${sx(x1).toFixed(1)} ${H-B} L${sx(x0).toFixed(1)} ${H-B} Z`;
  const lp=pts[pts.length-1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="График">
    ${g}
    <path d="${area}" fill="var(--plate-a)" opacity=".10"/>
    <path d="${d}" fill="none" stroke="var(--plate-a)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map(p=>`<circle cx="${sx(p.x)}" cy="${sy(p.y)}" r="2.6" fill="var(--plate-a)"/>`).join("")}
    <circle cx="${sx(lp.x)}" cy="${sy(lp.y)}" r="5" fill="var(--surface)" stroke="var(--plate-a)" stroke-width="2.5"/>
    <text x="${L}" y="${H-6}">${pts[0].label}</text>${pts.length>1?`<text x="${W-R}" y="${H-6}" text-anchor="end">${lp.label}</text>`:""}
  </svg>`;
}

// фото уменьшается до 256×256 (обрезка по центру), JPEG ~20–40 КБ, хранится в профиле
function loadPhoto(file){
  const img=new Image(),url=URL.createObjectURL(file);
  img.onload=()=>{try{const c=document.createElement("canvas");c.width=c.height=256;const m=Math.min(img.width,img.height);
    c.getContext("2d").drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,256,256);
    S.prof.photo=c.toDataURL("image/jpeg",0.82);saveProfile();render();toast("Фото обновлено")}catch(e){toast("Не удалось обработать фото")}URL.revokeObjectURL(url)};
  img.onerror=()=>{toast("Это фото не открылось");URL.revokeObjectURL(url)};
  img.src=url;
}

    <button class="btn primary full" data-act="onb-next" ${ok?"":"disabled style=\"opacity:.4\""}>${o.step===N-1?"Готово, поехали":"Дальше"}</button></div></div>`;
}
function onbInput(el){const o=S.onb;if(!o)return;o.d[el.dataset.o]=el.value;if(el.dataset.o==="name"){const b=$('[data-act="onb-next"]');if(b){const ok=!!el.value.trim();b.disabled=!ok;b.style.opacity=ok?"":".4"}}}
function finishOnboard(){
  const d=S.onb.d,num=v=>{const x=parseFloat(String(v).replace(",","."));return isNaN(x)?null:x};
  const bw=num(d.bw),gw=num(d.goalW);
  const g={...goals(),perWeek:d.per};if(gw&&gw>=30&&gw<=250)g.weight=gw;else delete g.weight;
  S.prof={...S.prof,name:d.name.trim(),nick:(d.nick||d.name).trim(),sex:d.sex,prio:d.prio,goals:g,remind:{days:d.days,time:d.time||"19:00"},tz:"Asia/Almaty",onboarded:new Date().toISOString()};
  LS.set("zal_name",S.prof.name);saveProfile();
  if(bw&&bw>=30&&bw<=250&&!(S.body.length&&S.body[S.body.length-1].date===today()&&S.body[S.body.length-1].kg===bw))saveBody(today(),Math.round(bw*10)/10);
  if(d.tpl&&d.tpl!=="keep")applyTemplate(d.tpl);
  const custom=d.tpl==="custom";
  S.onb=null;$("#onb").innerHTML="";S.tab=custom?"program":"today";if(custom)S.editDay="A";render();window.scrollTo(0,0);
  toast("Добро пожаловать, "+S.prof.nick+"!");
}
function onbAct(act,t){
  const o=S.onb;if(!o)return false;const d=o.d;
  const sync=()=>document.querySelectorAll("#onb [data-o]").forEach(el=>d[el.dataset.o]=el.value);
  switch(act){
    case "onb-next":sync();if(o.step===0&&!d.name.trim())return true;if(o.step===1&&!d.sex)return true;if(o.step===3)d.days=defaultDays(d.per);if(o.step===5){finishOnboard();return true}o.step++;break;
    case "onb-back":sync();o.step=Math.max(0,o.step-1);break;
    case "onb-nick":sync();d.nick=t.dataset.v;break;
    case "onb-sex":d.sex=t.dataset.v;break;
    case "onb-per":d.per=+t.dataset.v;if(d.tpl!=="keep")d.tpl=null;break;
    case "onb-prio":{const v=t.dataset.v;d.prio=d.prio.includes(v)?d.prio.filter(x=>x!==v):[...d.prio,v];break}
    case "onb-tpl":d.tpl=t.dataset.v;break;
    case "onb-day":{sync();const v=+t.dataset.v;d.days=d.days.includes(v)?d.days.filter(x=>x!==v):[...d.days,v];break}
    default:return false;
  }
  drawOnb();if(act==="onb-next"||act==="onb-back")$(".onb")&&($(".onb").scrollTop=0);return true;
}

/* ---------- герой (этап 7 ТЗ «Зал») ----------
   10 стадий × 2 пола, стадия = уровень 1–10 (дальше остаётся 10-я). Картинки hero/m1…m10.webp, f1…f10.webp
   (сгенерированы в Gemini, фон вырезан, все одной высоты и одного масштаба). Пол из профиля, по умолчанию мужской. */
const HERO_READY=true,HERO_MAX=10;
const heroSrc=(n,sex)=>`hero/${sex==="f"?"f":"m"}${Math.max(1,Math.min(HERO_MAX,n))}.webp`;
function figFor(st,sex,cls){if(!HERO_READY)return "";const n=Math.max(1,Math.min(HERO_MAX,st.level.n));
  return `<span class="figw ${cls||""}"><img src="${heroSrc(n,sex)}" alt="Герой, стадия ${n}" loading="lazy" decoding="async"></span>`}
function heroRow(st,sex){const cur=Math.min(HERO_MAX,st.level.n);
  return `<div class="herorow" aria-label="Все стадии героя">${LEVELS.map(([f,nm],i)=>`<div class="hs${i+1<=cur?"":" lock"}${i+1===cur?" cur":""}">${i+1<=cur?`<img src="${heroSrc(i+1,sex)}" alt="" loading="lazy" decoding="async">`:`<i class="q" aria-label="Откроется на уровне ${i+1}">?</i>`}<b>${i+1}</b><span>${esc(nm)}</span></div>`).join("")}</div>`}
function levelBar(st){const L=st.level,pct=Math.max(0,Math.min(100,(st.points-L.from)/(L.to-L.from)*100));return `<div class="bar"><i style="width:${pct}%;background:var(--plate-b)"></i></div>`}
function trackRow(t,st){
  let got=-1;t.steps.forEach((x,i)=>{if(st.medals[t.id+":"+i])got=i});
  const SS=stp(t,st.sex),v=st.tv[t.id]||0,nx=got+1<SS.length?SS[got+1]:null;
  const pct=nx==null?100:Math.max(0,Math.min(100,v/nx*100));
  const sub=nx==null?"Все ступени пройдены":t.id==="goal"?"Поставь цель и дойди до неё":`${fmtInt(v)} из ${fmtInt(nx)} ${t.d}`;
  return `<div class="trk${got<0?" lock":""}">${badgeHtml(t,Math.max(got,0),got>=0,"",st.sex)}
    <div class="grow"><div class="row between"><span class="tn">${esc(t.n)}</span><span class="tc">${got+1} из ${t.steps.length}</span></div>
    <div class="bar"><i style="width:${pct}%;background:var(--plate-c)"></i></div><div class="ts">${esc(sub)}</div></div></div>`}
function awardsSection(st,other,sex){
  st=st||calcStats();const L=st.level;

    <div class="row" style="gap:14px">${HERO_READY?"":`<span class="lvl num">${L.n}</span>`}<div class="grow" style="flex:1;min-width:0"><div class="t" style="font-weight:800">Уровень ${L.n} «${esc(L.name)}»</div>${levelBar(st)}<div class="muted" style="font-size:13px;margin-top:4px">До уровня ${L.n+1}${L.n<HERO_MAX?" (новый облик)":""}: ${fmtInt(L.to-st.points)} очков</div></div></div>
    ${HERO_READY?heroRow(st,other?sex:S.prof.sex):""}
    <div class="kv"><div><b>${st.streak}</b><span>стрик, нед.</span></div><div><b>${st.bestStreak}</b><span>лучший стрик</span></div><div><b>${st.prs}</b><span>рекордов</span></div></div>
    <div class="kv"><div><b>${st.si||"—"}</b><span>индекс силы</span></div><div><b>${st.si&&st.si30?(st.si-st.si30>=0?"+":"")+(st.si-st.si30):"—"}</b><span>за 30 дней</span></div><div><b>${st.freezes} из ${FREEZE_MAX}</b><span>заморозки</span></div></div>

    <div class="tracks">${TRACKS.map(t=>trackRow(t,st)).join("")}</div>
    <details class="pts"><summary>За что очки, индекс силы, заморозки</summary><div class="exlog" style="margin-top:8px">

      <div class="r"><span>Новый рекорд в упражнении (на 10% больше прошлого)</span><span>${PTS.pr}</span></div>
      <div class="r"><span>Засчитанная неделя стрика</span><span>${PTS.week}</span></div>
      <div class="r"><span>Каждая ступень награды</span><span>${PTS.medal}</span></div>
      <div class="r"><span>Уровни</span><span>500 · 1 500 · 3 500 · 7 000, дальше каждые +4 000</span></div></div>
      <div class="muted" style="font-size:13px;margin-top:8px"><b>Индекс силы</b>: сумма лучших расчётных максимумов на 1 раз в приседе, жиме лёжа и становой, как сумма в троеборье. Растёт вместе с рабочими весами.<br><b>Заморозка стрика</b>: даётся за каждые 4 засчитанные недели подряд, копится до 2. Если неделя не засчитана (болезнь, поездка), заморозка тратится сама и стрик не обнуляется.</div></details>
  </div>
  ${recs.length?`<div class="card stack"><h2>Личные рекорды</h2><div class="exlog">${recs.map(([x,b])=>`<div class="r"><span>${esc(EXMAP[x]?EXMAP[x].n:(b.n||exName(x)))}</span><span>${fmtKg(b.w)}×${b.r} · ${fdate(b.date)}</span></div>`).join("")}</div><div class="muted" style="font-size:13px">Лучший подход по расчётному максимуму на 1 раз. Первый результат рекордом не считается, рекорд — когда побил прошлый лучший.</div></div>`:""}`;
}

/* ---------- семья (этап 5 ТЗ «Зал») ----------
   Правила базы (RLS) уже дают каждому из списка почт читать тренировки, вес и профили всех.
   Здесь только чтение: менять чужие данные приложение не умеет. Очки, медали и победители месяца
   считаются теми же функциями, что и свои, поэтому у всех получаются одинаковые цифры. */
const F={loading:false,err:null,errAt:0,data:LS.get("zal_fam",null),member:null};
const monthKey=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
const MONTHS=["январь","февраль","март","апрель","май","июнь","июль","август","сентябрь","октябрь","ноябрь","декабрь"];
const MONTHS_P=["январе","феврале","марте","апреле","мае","июне","июле","августе","сентябре","октябре","ноябре","декабре"];
async function loadFam(force){
  if(!sb||!C.user||C.allowed!==true||F.loading)return;
  if(!force&&F.data&&F.data.me===C.user.id&&Date.now()-F.data.t<60000)return;
  if(!force&&F.err&&Date.now()-F.errAt<20000)return;
  if(!navigator.onLine){F.err="offline";F.errAt=Date.now();return}
  F.loading=true;
  try{
    const [a,p,w,b]=await Promise.all([
      sb.from("allowed_emails").select("email,name,added_at").order("added_at"),
      sb.from("profiles").select("user_id,email,name,avatar_url,data"),
      sb.from("workouts").select("user_id,data").eq("deleted",false).range(0,9999),
      sb.from("body").select("user_id,date,kg").eq("deleted",false).range(0,9999)]);
    const e=a.error||p.error||w.error||b.error;if(e)throw e;
    const prof=new Map(p.data.map(r=>[(r.email||"").toLowerCase(),r]));
    const members=a.data.map(r=>{const pr=prof.get(r.email),d=(pr&&pr.data)||{},id=pr?pr.user_id:null;
      return {uid:id,email:r.email,name:d.name||r.name||((pr&&pr.name)||"").split(" ")[0]||r.email.split("@")[0],
        photo:d.photo||(pr&&pr.avatar_url)||null,sex:d.sex||null,goals:d.goals||{},
        workouts:id?w.data.filter(x=>x.user_id===id&&x.data&&x.data.startedAt).map(x=>normWorkout(x.data)).sort((x,y)=>y.startedAt.localeCompare(x.startedAt)):[],
        body:id?b.data.filter(x=>x.user_id===id&&x.kg!=null).map(x=>({id:x.date,date:x.date,kg:+x.kg})).sort((x,y)=>x.date.localeCompare(y.date)):[]}});
    F.data={t:Date.now(),me:C.user.id,members};F.err=null;
    if(!LS.set("zal_fam",F.data))LS.del("zal_fam");
  }catch(e){F.err=navigator.onLine?"err":"offline";F.errAt=Date.now()}
  F.loading=false;
  if(S.tab==="family"&&!$("#modal").innerHTML&&!(S.active&&S.layerOpen)&&!S.onb)render();
}
// участники: свои данные берём с телефона (они свежее облака), чужие из облака
function famMembers(){
  if(!F.data||!C.user||F.data.me!==C.user.id)return [];
  const ms=F.data.members.map(m=>m.uid===C.user.id?{...m,me:true,name:S.prof.name||nick()||m.name,photo:S.prof.photo||C.meta.avatar||m.photo,sex:S.prof.sex||m.sex,goals:goals(),workouts:S.workouts,body:S.body}:m);
  const rows=ms.filter(m=>m.uid).flatMap(m=>m.workouts.map(w=>({user_id:m.uid,started_at:w.startedAt})));
  const cur=monthKey(new Date()),by=monthCounts(rows),past={};for(const k in by)if(k<cur)past[k]=by[k];
  return ms.map(m=>({...m,wins:m.uid?winsFor(past,m.uid):[],month:m.uid?((by[cur]||{})[m.uid]||0):0}));
}
const famById=id=>famMembers().find(m=>m.uid===id);
const did=m=>m.sex==="f"?"сделала":m.sex==="m"?"сделал":"сделал(а)";
function famAvatar(m,cls=""){return m.photo?`<span class="avatar ${cls}"><img src="${esc(m.photo)}" alt="" referrerpolicy="no-referrer"></span>`:`<span class="avatar ${cls}">${esc((m.name||"?")[0].toUpperCase())}</span>`}
function relDay(iso){const n=daysSince(iso);return n===0?"сегодня":n===1?"вчера":fdateL(iso)}
function famStats(m){return m.me?calcStats():calcStats({workouts:m.workouts,body:m.body,goals:m.goals,wins:m.wins,famDays:famDaysExcept(m.uid),sex:m.sex})}
function challengeCard(ms){
  const now=new Date(),left=new Date(now.getFullYear(),now.getMonth()+1,0).getDate()-now.getDate();
  const act=ms.filter(m=>m.uid).sort((a,b)=>b.month-a.month||a.name.localeCompare(b.name));
  const top=act.length?act[0].month:0,withW=act.filter(m=>m.month>0).length;
  let place=0,prev=null;
  const rows=act.map((m,i)=>{if(m.month!==prev){place=i+1;prev=m.month}const lead=m.month>0&&m.month===top;
    return `<button class="item chal${lead?" lead":""}" data-act="fam-open" data-uid="${esc(m.uid)}"><span class="place num">${place}</span>${famAvatar(m)}
      <span class="grow"><span class="t">${esc(m.name)}${m.me?" (ты)":""}</span><span class="bar"><i style="width:${top?Math.round(m.month/top*100):0}%"></i></span></span>
      <span class="num cnt">${m.month}</span></button>`}).join("");
  const waiting=ms.filter(m=>!m.uid);
  // прошлый месяц: победитель, если тренировались хотя бы двое

    <div class="muted" style="font-size:13px">Кто больше тренировок за месяц. Групповые занятия тоже считаются. Победитель получает медаль «Победитель месяца» 1-го числа.</div>
    <div class="list flat">${rows||`<div class="empty">Пока никто не вошёл в приложение</div>`}
    ${waiting.map(m=>`<div class="item chal off"><span class="place num">–</span>${famAvatar(m)}<span class="grow"><span class="t">${esc(m.name)}</span><br><span class="s">ещё не входил(а) в приложение</span></span></div>`).join("")}</div>
    ${withW<2?`<div class="banner">Победитель будет, только если в этом месяце тренируются хотя бы двое.</div>`:""}
    ${pw.length?`<div class="muted" style="font-size:14px">Победитель в ${MONTHS_P[pm.getMonth()]}: <b>${pw.map(m=>esc(m.name)).join(", ")}</b></div>`:""}
  </div>`;
}
function feedItem(m,w,st){
  const prs=(st.prByW[w.id]||[]);

  const sub=isGroup(w)?"групповое занятие":[w.finishedAt?fdur(new Date(w.finishedAt)-new Date(w.startedAt)):"",fmtInt(tonnage(w))+" кг"].filter(Boolean).join(" · ");

    ${prs.length?`<span class="prs">${prs.slice(0,2).map(x=>`<span class="pr">рекорд · ${esc(EXMAP[x.x]?EXMAP[x.x].n:x.n)} ${x.w>0?fmtKg(x.w)+"×"+x.r:x.r+" повт."}</span>`).join("")}${prs.length>2?`<span class="pr">+${prs.length-2}</span>`:""}</span>`:""}</span></button>`;
}
function vFamily(){
  if(F.member)return vMember(F.member);
  const head=`<div class="top"><div><div class="eyebrow">Все вместе</div><h1>Семья</h1></div>${accountBtn()}</div>`;
  if(!sb||!C.user||C.allowed!==true)return `${head}<div class="stack"><div class="card stack"><h2>Семья видна после входа</h2><div class="muted">Здесь челлендж месяца, лента тренировок и профили всех, кто есть в списке семьи.</div>${sb&&!C.user?`<button class="btn primary full" data-act="login">Войти через Google</button>`:""}</div></div>`;
  loadFam();
  const ms=famMembers();
  if(!ms.length)return `${head}<div class="stack"><div class="list"><div class="empty">${F.err==="offline"?"Нет сети. Семья загрузится, когда появится интернет.":F.err?"Не загрузилось. Попробую ещё раз.<br><br><button class='btn ghost sm' data-act='fam-reload'>Обновить</button>":"Загружаю семью…"}</div></div></div>`;
  const stats=new Map(ms.filter(m=>m.uid).map(m=>[m.uid,famStats(m)]));
  const feed=ms.filter(m=>m.uid).flatMap(m=>m.workouts.map(w=>({m,w}))).sort((a,b)=>b.w.startedAt.localeCompare(a.w.startedAt)).slice(0,30);
  return `${head}<div class="stack">
    ${F.err?`<div class="banner">${F.err==="offline"?"Нет сети: показываю то, что было загружено раньше.":"Не удалось обновить, показываю прошлые данные."}</div>`:""}
    ${challengeCard(ms)}
    <div class="section-title"><h2>Все участники</h2></div>
    <div class="list">${ms.filter(m=>m.uid).map(m=>{const st=stats.get(m.uid);return `<button class="item" data-act="fam-open" data-uid="${esc(m.uid)}">${famAvatar(m)}
      <span class="grow"><span class="t">${esc(m.name)}${m.me?" (ты)":""}</span><span class="fs">Уровень ${st.level.n} «${esc(st.level.name)}»<br>${IC.fire}${st.streak} ${nedel(st.streak)} подряд · наград ${Object.keys(st.medals).length}</span></span>${figFor(st,m.sex,"fam")}<span class="chev">›</span></button>`}).join("")}</div>
    <div class="section-title"><h2>Лента</h2><button class="linkbtn" data-act="fam-reload" style="margin:0">${F.loading?"обновляю…":"обновить"}</button></div>
    <div class="list">${feed.length?feed.map(x=>feedItem(x.m,x.w,stats.get(x.m.uid))).join(""):`<div class="empty">Здесь появятся тренировки всей семьи.</div>`}</div>
    ${C.admin?`<button class="btn ghost full" data-act="account">Доступ: кто может входить</button>`:""}
  </div>`;
}
function vMember(id){
  const m=famById(id);if(!m){F.member=null;return vFamily()}

  return `<div class="top"><button class="btn ghost sm" data-act="fam-back">‹ Семья</button></div><div class="stack">
    <div class="card row" style="gap:14px">${famAvatar(m,"xl")}<div style="min-width:0"><h2 style="font-size:22px">${esc(m.name)}${m.me?" (ты)":""}</h2>
      <div class="muted" style="font-size:14px">${ws.length} трен. всего · в этом месяце ${m.month}${ws.length?"<br>последняя: "+relDay(ws[0].startedAt):""}</div></div></div>

  x.fillStyle=fg;fitText(x,info.title.toUpperCase()+(info.nick?",":"!"),`800 {s}px ${D}`,250,W-150);x.fillText(info.title.toUpperCase()+(info.nick?",":"!"),72,690);
  let y=690;

function roundRect(x,l,t,w,h,r){x.beginPath();x.moveTo(l+r,t);x.arcTo(l+w,t,l+w,t+h,r);x.arcTo(l+w,t+h,l,t+h,r);x.arcTo(l,t+h,l,t,r);x.arcTo(l,t,l+w,t,r);x.closePath()}

    case "group":showGroup();break;
    case "grp-kind":S.grp.kind=t.dataset.k;drawGroup();break;
    case "grp-min":S.grp.min=Math.max(5,Math.min(300,S.grp.min+(+t.dataset.d)));drawGroup();break;
    case "grp-save":saveGroup();break;
    case "pv":S.progView=t.dataset.v;render();break;
    case "p-sex":S.prof.sex=t.dataset.v;saveProfile();render();break;
    case "photo-reset":delete S.prof.photo;saveProfile();render();break;
    case "rm-day":{const rm=S.prof.remind||{days:[],time:"19:00"};const v=+t.dataset.d;rm.days=(rm.days||[]).includes(v)?rm.days.filter(x=>x!==v):[...(rm.days||[]),v];S.prof.remind=rm;saveProfile();render();break}
    case "onb-again":startOnboard();break;
    case "start":closeSheet();if(!S.active)startWorkout(t.dataset.k);break;
    case "preview":showPreview(t.dataset.k);break;
    case "pick":S.pick=t.dataset.k===nextKey()?null:t.dataset.k;render();break;
    case "resume":S.layerOpen=true;wake(true);renderLayer();break;
    case "minimize":S.layerOpen=false;$("#layer").innerHTML="";clearInterval(clockTick);render();break;
    case "w-":bump(i,j,"w",-1);break; case "w+":bump(i,j,"w",1);break;
    case "r-":bump(i,j,"r",-1);break; case "r+":bump(i,j,"r",1);break;
    case "done":{const e=S.active.exercises[i],s=e.sets[j];s.done=!s.done;saveActive();
      if(s.done&&isPR(e,s)&&!e.sets.some((x,k)=>k!==j&&x.done&&isPR(e,x)&&setScore(x)>=setScore(s))){toast("🏆 Новый рекорд: "+e.n);try{navigator.vibrate&&navigator.vibrate([60,40,60])}catch(_){}}
      if(s.done){const nextUndone=e.sets.some(x=>!x.done);const label=nextUndone?e.n:"дальше: "+(S.active.exercises[i+1]?.n||"финиш");startRest(e.rest||90,label)}
      renderLayer();break;}
    case "set-add":{const e=S.active.exercises[i];const l=e.sets[e.sets.length-1];e.sets.push({w:l.w,r:l.r,done:false});saveActive();renderLayer();break}
    case "set-del":{const e=S.active.exercises[i];if(e.sets.length>1){e.sets.pop();saveActive();renderLayer()}break}
    case "swap":showSwap(i);break;
    case "swap-pick":showSwapMode(i,t.dataset.x);break;
    case "swap-do":doSwap(i,t.dataset.x,t.dataset.mode);break;
    case "prog-reset":{const k=t.dataset.k,td=tplDay(k),d=day(k);if(td&&d){d.ex=clone(td.ex);saveProgram();showPreview(k);render();toast("Упражнения как в шаблоне")}break}
    case "undim":if(S.go){S.go=false}else if(S.rest){S.rest.dim=false;S.rest.dimAt=Date.now()+DIM_AFTER}drawDim();break;
    case "rest-add":if(S.rest){S.rest.end=Math.max(S.rest.end,Date.now())+30000;S.rest.total+=30;S.rest.beeped=false;S.go=false;LS.set("zal_rest",S.rest);drawRest()}break;
    case "rest-stop":stopRest();break;
    case "finish-ask":showFinishAsk();break;
    case "finish":closeSheet();finishWorkout();break;
    case "discard":S.active=null;saveActive();stopRest();wake(false);closeSheet();$("#layer").innerHTML="";clearInterval(clockTick);render();toast("Тренировка отменена");break;
    case "close-sheet":case "close-sheet-btn":closeSheet();break;
    case "hist":showHist(t.dataset.id);break;
    case "fam-open":F.member=t.dataset.uid;render();window.scrollTo(0,0);break;
    case "fam-back":F.member=null;render();window.scrollTo(0,0);break;
    case "fam-w":showFamW(t.dataset.uid,t.dataset.id);break;
    case "fam-reload":loadFam(true);render();break;
    case "hist-del":showHist(t.dataset.id,true);break;
    case "hist-del-yes":deleteWorkout(t.dataset.id);closeSheet();render();toast("Тренировка удалена");break;
    case "backup":doBackup();break;
    case "story":shareStory();break;
    case "diag":S.diag=!S.diag;render();break;
    case "bw-del":deleteBody(t.dataset.d);render();break;
    case "login":closeSheet();login();break;
    case "logout":logout();break;
    case "push-on":pushEnable();break;
    case "push-tg":pushToggle(t.dataset.v==="1");break;
    case "push-test":pushTest();break;
    case "push-nudge-x":LS.set("zal_push_nudge",1);render();break;
    case "own-yes":LS.set("zal_owner",C.user.id);S.workouts.forEach(w=>enqueue({k:"w",id:w.id}));S.body.forEach(b=>enqueue({k:"b",id:b.date}));if(LS.get("zal_program",null))enqueue({k:"p"});if(Object.keys(S.prof).length)enqueue({k:"pr"});closeSheet();render();syncNow().then(()=>toast("Перенесено в облако: "+S.workouts.length+" трен."));break;
    case "account":showAccount();break;
    case "sync":syncNow().then(()=>{if($("#famList"))showAccount();else if(S.tab==="profile")render()});break;
    case "fam-del":if(t.dataset.confirm){delFamily(t.dataset.email)}else{t.dataset.confirm="1";t.textContent="Точно?"}break;
  }
});
document.addEventListener("input",ev=>{if(ev.target.dataset&&ev.target.dataset.o)onbInput(ev.target)});
document.addEventListener("change",ev=>{
  const el=ev.target;
  if(el.dataset&&el.dataset.f&&S.active){const s=S.active.exercises[+el.dataset.i].sets[+el.dataset.j];const v=parseFloat(String(el.value).replace(",","."));if(!isNaN(v)&&v>=0){s[el.dataset.f]=el.dataset.f==="r"?Math.round(v):v;saveActive()}renderLayer();return}
  if(el.id==="restoreFile"&&el.files&&el.files[0]){doRestore(el.files[0]);el.value="";return}
  if(el.id==="photoFile"&&el.files&&el.files[0]){loadPhoto(el.files[0]);el.value="";return}
  if(el.id==="rmTime"){S.prof.remind={...(S.prof.remind||{days:[]}),time:el.value||"19:00"};saveProfile();return}
  if(el.id==="progSel"){S.progEx=el.value;LS.set("zal_progEx",el.value);render()}
});
document.addEventListener("submit",ev=>{
  if(ev.target.id==="famForm"){ev.preventDefault();addFamily($("#famEmail").value,$("#famName").value);return}
  if(ev.target.id==="dayForm"){ev.preventDefault();const d=day(ev.target.dataset.k);if(!d)return;const nk=$("#dKey").value.trim().toUpperCase()||d.k;
    if(nk!==d.k&&day(nk)){toast("Метка «"+nk+"» уже занята");return}
    const old=d.k;d.title=$("#dTitle").value.trim()||d.title;d.focus=$("#dFocus").value.trim();
    if(nk!==old){d.k=nk;S.workouts.forEach(w=>{if(w.prog===old){w.prog=nk;enqueue({k:"w",id:w.id})}});persist("zal_workouts",S.workouts);if(S.pick===old)S.pick=nk}
    S.editDay=d.k;saveProgram();render();toast("Сохранено");return}
  if(ev.target.id==="meForm"){ev.preventDefault();S.prof.name=$("#pName").value.trim();S.prof.nick=$("#pNick").value.trim();if(S.prof.name)LS.set("zal_name",S.prof.name);saveProfile();render();toast("Сохранено");return}
  if(ev.target.id==="goalForm"){ev.preventDefault();const num=v=>{const x=parseFloat(String(v).replace(",","."));return isNaN(x)?null:x};
    const g={perWeek:+$("#gPer").value||3},w=num($("#gW").value),rx=$("#gRx").value,rk=num($("#gRkg").value);
    if(w&&w>=30&&w<=250)g.weight=w;if(rx&&rk&&rk>0)g.record={x:rx,kg:rk};
    S.prof.goals=g;saveProfile();render();toast("Цели сохранены");return}
  if(ev.target.id!=="bwForm")return;ev.preventDefault();
  const kg=parseFloat(String($("#bwKg").value).replace(",","."));const date=$("#bwDate").value||today();
  if(isNaN(kg)||kg<30||kg>250){toast("Введи вес от 30 до 250 кг");return}
  saveBody(date,Math.round(kg*10)/10);render();toast("Вес записан");
});
// возврат в приложение (например, после YouTube): снова запрещаем гаснуть экрану, таймер показывает верное время
document.addEventListener("visibilitychange",()=>{if(document.hidden)return;if(S.active)wake(true);try{audio&&audio.state!=="running"&&audio.resume()}catch(e){}if(S.rest)drawRest()});

restoreRest();
render();
if("serviceWorker" in navigator){
  const had=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{if(had&&!S.active&&!window.__rl){window.__rl=1;location.reload()}});
  addEventListener("load",()=>navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(r=>r.update()).catch(()=>{}));
}
</script>
</body>
